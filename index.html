<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Atelier — Suivi Production</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#FFF;--surface2:#F4F3EF;--surface3:#ECEAE5;
  --border:#DDDBD5;--border2:#C8C6BF;
  --text:#1A1A17;--text2:#6A6A65;--text3:#A8A8A3;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-mid:#1D9E75;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --amber:#7A470A;--amber-bg:#FAEEDA;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --gray:#5F5E5A;--gray-bg:#F1EFE8;
  --r:8px;--rl:12px;--rxl:16px;
  --sidebar:210px;--bottombar:60px;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--surface2);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ─── LAYOUT ─── */
.app{display:flex;min-height:100vh}

/* SIDEBAR desktop */
.sidebar{width:var(--sidebar);background:#17171A;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.brand{padding:18px 16px 16px;border-bottom:1px solid #2C2C2F;margin-bottom:6px}
.brand-name{color:#FFF;font-size:15px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.brand-name i{font-size:18px;color:#1D9E75}
.brand-sub{color:#666;font-size:11px;margin-top:2px}
.nav-section{padding:4px 10px 2px;font-size:10px;color:#444;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;color:#888;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;border-radius:var(--r);margin:1px 6px;width:calc(100% - 12px);transition:all .12s}
.nav-item i{font-size:15px;flex-shrink:0}
.nav-item:hover{color:#CCC;background:#23232A}
.nav-item.active{color:#FFF;background:#2A2A32;font-weight:500}
.nav-item .badge{margin-left:auto;background:#A32D2D;color:#FFF;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px}
.content{padding:20px;flex:1}

/* BOTTOM NAV mobile */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#17171A;border-top:1px solid #2C2C2F;z-index:100;height:var(--bottombar)}
.bottomnav-inner{display:flex;height:100%}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#666;font-size:9px;border:none;background:none;cursor:pointer;padding:4px 0;position:relative}
.bn-item i{font-size:18px}
.bn-item.active{color:#1D9E75}
.bn-item .badge{position:absolute;top:5px;right:calc(50% - 14px);background:#A32D2D;color:#FFF;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px}

/* ─── COMPONENTS ─── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.stat-ico{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:17px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:28px;font-weight:700;letter-spacing:-1.5px;line-height:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.card-title i{font-size:15px;color:var(--text3)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--text2);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAF8}

.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.st-wait{background:var(--surface2);color:var(--text2)}
.st-run{background:var(--teal-bg);color:var(--teal)}
.st-done{background:var(--green-bg);color:var(--green)}
.st-late{background:var(--red-bg);color:var(--red)}
.st-cancel{background:var(--gray-bg);color:var(--gray)}
.st-launched{background:var(--purple-bg);color:var(--purple)}
.st-apure{background:var(--amber-bg);color:var(--amber)}
.pr-urgent{background:var(--red-bg);color:var(--red)}
.pr-normal{background:var(--blue-bg);color:var(--blue)}
.pr-low{background:var(--gray-bg);color:var(--gray)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .12s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:#17171A;color:#FFF;border-color:#17171A}
.btn-primary:hover{background:#2C2C32}
.btn-teal{background:var(--teal);color:#FFF;border-color:var(--teal)}
.btn-teal:hover{background:#0A5040}
.btn-purple{background:var(--purple);color:#FFF;border-color:var(--purple)}
.btn-purple:hover{background:#3C3489}
.btn-red{background:var(--red-bg);color:var(--red);border-color:#F09595}
.btn-red:hover{background:#F7C1C1}
.btn-sm{font-size:12px;padding:5px 11px}
.btn-xs{font-size:11px;padding:3px 9px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--surface);color:var(--text);width:100%;font-size:13px;transition:border .15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:#17171A;box-shadow:0 0 0 2px rgba(23,23,26,.06)}
textarea{resize:vertical}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fb{padding:5px 13px;font-size:12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;font-weight:500}
.fb.active{background:#17171A;color:#FFF;border-color:#17171A}
.fb:hover:not(.active){background:var(--surface3)}

.alert-banner{background:var(--red-bg);border:1px solid #F09595;border-radius:var(--rl);overflow:hidden;margin-bottom:16px}
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F7C1C1;background:var(--surface);flex-wrap:wrap}
.alert-row:last-child{border-bottom:none}

/* planning */
.plan-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.plan-table{border-collapse:collapse;min-width:760px}
.plan-table th{font-size:11px;font-weight:600;color:var(--text2);padding:7px 8px;text-align:center;border:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.plan-table th.today-h{color:var(--blue);border-bottom:2px solid var(--blue)}
.ws-col{font-size:12px;font-weight:600;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;min-width:130px;color:var(--text)}
.pcell{padding:5px 6px;border:1px solid var(--border);min-width:100px;height:50px;vertical-align:top;cursor:pointer;transition:background .1s;background:var(--surface)}
.pcell:hover{background:#F0F8FF}
.pcell.sel{background:#EBF4FF;border-color:var(--blue)}
.pcell.today-c{border-left:2px solid var(--blue)}
.cell-of{font-weight:700;font-size:10px;color:var(--teal)}
.cell-h{font-size:10px;color:var(--text3)}
.cell-note{font-size:10px;color:var(--text3);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.assign-panel{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--rl);padding:14px 18px;margin-bottom:14px}
.assign-grid{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:end;margin-bottom:10px}

/* OF launch */
.of-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.of-card-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .12s}
.of-card-header:hover{background:var(--surface2)}
.of-card-body{padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2)}
.of-lines-table th,.of-lines-table td{font-size:12px;padding:6px 10px}
.ws-assign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.ws-assign-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.ws-assign-item label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}

/* apurement */
.apur-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.apur-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .12s}
.apur-header:hover{background:var(--surface2)}
.apur-body{padding:14px 16px;border-top:1px solid var(--border)}
.apur-table th,.apur-table td{font-size:12px;padding:6px 10px}
.bon-preview{background:var(--surface);border:2px dashed var(--border2);border-radius:var(--rl);padding:18px;margin-top:12px}
.bon-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px}
.bon-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:12px}
.bon-meta span{color:var(--text2)}

/* empty state */
.empty{padding:2.5rem;text-align:center;color:var(--text3)}
.empty i{font-size:36px;display:block;margin-bottom:8px;opacity:.4}
.empty p{font-size:13px}

/* mobile */
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:var(--bottombar)}
  .bottomnav{display:block}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:12px}
  .stat-val{font-size:24px}
  .content{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .assign-grid{grid-template-columns:1fr;gap:8px}
  .card{padding:12px 14px}
  th,td{padding:7px 9px}
  .btn{padding:7px 12px;font-size:12px}
  .topbar{padding:0 14px}
  .ws-assign-grid{grid-template-columns:1fr 1fr}
  .bon-meta{grid-template-columns:1fr}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-scroll table{min-width:580px}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .ws-assign-grid{grid-template-columns:1fr}
  .table-scroll table{min-width:480px}
}

/* hide on mobile for tables */
.hide-mobile{display:table-cell}
@media(max-width:600px){.hide-mobile{display:none}}

/* print */
@media print{
  .sidebar,.bottomnav,.topbar,.no-print{display:none!important}
  .main{margin:0}
  .bon-preview{border:1px solid #999;page-break-inside:avoid}
  .content{padding:10px}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR desktop -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name"><i class="ti ti-settings-2"></i>Atelier</div>
      <div class="brand-sub">Suivi de production</div>
    </div>
    <div class="nav-section">Gestion</div>
    <button class="nav-item active" data-tab="dashboard"><i class="ti ti-home-2"></i>Tableau de bord</button>
    <button class="nav-item" data-tab="new_order"><i class="ti ti-file-plus"></i>Nouvelle commande</button>
    <button class="nav-item" data-tab="orders"><i class="ti ti-clipboard-list"></i>Commandes <span class="badge" id="badge-late" style="display:none">0</span></button>
    <div class="nav-section">Production</div>
    <button class="nav-item" data-tab="launch"><i class="ti ti-rocket"></i>Lancement OF</button>
    <button class="nav-item" data-tab="planning"><i class="ti ti-calendar-week"></i>Planning</button>
    <div class="nav-section">Stock</div>
    <button class="nav-item" data-tab="apurement"><i class="ti ti-checkup-list"></i>Apurement</button>
    <button class="nav-item" data-tab="bons"><i class="ti ti-package"></i>Bons d'entrée</button>
  </aside>

  <div class="main">
    <!-- TOP BAR -->
    <div class="topbar">
      <div>
        <div class="topbar-title" id="page-title">Tableau de bord</div>
        <div id="topbar-date" style="font-size:11px;color:var(--text3)"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm no-print" id="btn-new-order" onclick="setTab('new_order')"><i class="ti ti-plus"></i><span class="hide-mobile">Commande</span></button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="content"></div>
  </div>

  <!-- BOTTOM NAV mobile -->
  <nav class="bottomnav">
    <div class="bottomnav-inner">
      <button class="bn-item active" data-tab="dashboard"><i class="ti ti-home-2"></i>Accueil</button>
      <button class="bn-item" data-tab="orders"><i class="ti ti-clipboard-list"></i>Commandes<span class="badge" id="badge-late-m" style="display:none">0</span></button>
      <button class="bn-item" data-tab="launch"><i class="ti ti-rocket"></i>Lancement</button>
      <button class="bn-item" data-tab="apurement"><i class="ti ti-checkup-list"></i>Apurement</button>
      <button class="bn-item" data-tab="planning"><i class="ti ti-calendar-week"></i>Planning</button>
    </div>
  </nav>
</div>

<script>
// ─── DATA ───
const WS=[
  {id:"press60",name:"Presse 60T",grp:"Presses"},{id:"ebav1",name:"Ébavurage 1",grp:"Finition"},{id:"ebav2",name:"Ébavurage 2",grp:"Finition"},
  {id:"coupe_auto",name:"Coupe automatique",grp:"Découpe"},{id:"perc_tar",name:"Perçage/Taraudage",grp:"Usinage"},
  {id:"cnc3m",name:"CNC 3m",grp:"Usinage"},{id:"cnc15m",name:"CNC 1,5m",grp:"Usinage"},{id:"coupe_semi",name:"Coupe semi-auto",grp:"Découpe"},
  {id:"coupe45",name:"Coupe 45°",grp:"Découpe"},{id:"cintr",name:"Cintreuse miroirs",grp:"Miroirs"},
  {id:"asm_mir",name:"Assemblage miroir",grp:"Miroirs"},{id:"asm_fac",name:"Assemblage façades",grp:"Façades"},
  {id:"peinture",name:"Ligne peinture",grp:"Finition"},{id:"inj125a",name:"Injection 125T-I",grp:"Injection"},
  {id:"inj125b",name:"Injection 125T-II",grp:"Injection"},{id:"inj220",name:"Injection 220T",grp:"Injection"},
];
const REFS=["P-204","P-210","P-215","P-229","P-231","P-234","P-235","P-236","P-239","F-500","F-501","F-502","F-503"];
const DIMS=["","15","20","25","30","35","40","45","50","60","80","90","100","120"];
const COLORS=["","Noir","Champagne","Moon light","Personnalisée"];
const UNIT_FIXED="pqt 25 pcs";
const CURRENCIES=["TND","EUR","USD","DZD","MAD","GBP"];
const STATUSES={
  "EN_ATTENTE":{label:"En attente",pill:"st-wait"},
  "LANCÉ":{label:"Lancé",pill:"st-launched"},
  "EN_COURS":{label:"En cours",pill:"st-run"},
  "APURÉ":{label:"Apuré",pill:"st-apure"},
  "TERMINÉ":{label:"Terminé",pill:"st-done"},
  "ANNULÉ":{label:"Annulé",pill:"st-cancel"},
};
const PRIOS={"URGENT":{pill:"pr-urgent"},"NORMAL":{pill:"pr-normal"},"FAIBLE":{pill:"pr-low"}};
const K_ORDERS="prd_orders_v5",K_PLAN="prd_plan_v5",K_BONS="prd_bons_v5";

let S={tab:"dashboard",orders:[],plan:{},bons:[],weekOff:0,form:null,filter:"TOUS",planSel:null,openOf:null,openApur:null};

// ════════════════════════════════════════════════════════
// ─── FIREBASE CONFIG ─── Collez votre config ici ───────
// ════════════════════════════════════════════════════════
const FB_CONFIG = {
  apiKey:            "AIzaSyC2Zf5CSAVEx4axHRUan8xcNe66MD7yVG4",
  authDomain:        "und-center.firebaseapp.com",
  databaseURL:       "https://und-center-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "und-center",
  storageBucket:     "und-center.firebasestorage.app",
  messagingSenderId: "248182618048",
  appId:             "1:248182618048:web:54c2cf9dc55a424f197a25"
};
// ════════════════════════════════════════════════════════

const FB_ACTIVE = FB_CONFIG.apiKey !== "VOTRE_API_KEY";
let db = null;
if(FB_ACTIVE){
  firebase.initializeApp(FB_CONFIG);
  db = firebase.database();
  console.log("✅ Firebase connecté — mode données partagées");
} else {
  console.log("⚠️ Firebase non configuré — mode localStorage local");
}

// ─── PERSISTENCE ───
function ls_get(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function saveOrders(){
  if(db) db.ref("orders").set(S.orders);
  else ls_set(K_ORDERS,S.orders);
}
function savePlan(){
  if(db) db.ref("plan").set(S.plan);
  else ls_set(K_PLAN,S.plan);
}
function saveBons(){
  if(db) db.ref("bons").set(S.bons);
  else ls_set(K_BONS,S.bons);
}

async function loadAll(){
  if(db){
    const [oSnap,pSnap,bSnap]=await Promise.all([
      db.ref("orders").once("value"),
      db.ref("plan").once("value"),
      db.ref("bons").once("value"),
    ]);
    S.orders=oSnap.val()||[];
    S.plan=pSnap.val()||{};
    S.bons=bSnap.val()||[];
    // Listeners temps réel — sync automatique entre utilisateurs
    db.ref("orders").on("value",snap=>{
      const v=snap.val()||[];
      // Ne re-rendre que si les données ont changé (évite boucle infinie sur nos propres écritures)
      if(JSON.stringify(v)!==JSON.stringify(S.orders)){S.orders=v;updateBadges();render();}
    });
    db.ref("bons").on("value",snap=>{
      const v=snap.val()||[];
      if(JSON.stringify(v)!==JSON.stringify(S.bons)){S.bons=v;if(S.tab==="bons")render();}
    });
  } else {
    S.orders=ls_get(K_ORDERS)||[];
    S.plan=ls_get(K_PLAN)||{};
    S.bons=ls_get(K_BONS)||[];
  }
  S.form=emptyForm();
}

// ─── HELPERS ───
function isoDate(d){return d.toISOString().split("T")[0];}
function todayStr(){return isoDate(new Date());}
function daysLeft(dl){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(dl)-t)/86400000);}
function getWeekDays(off){
  const n=new Date(),dow=n.getDay();
  const mon=new Date(n);mon.setDate(n.getDate()-(dow===0?6:dow-1)+off*7);mon.setHours(0,0,0,0);
  return Array.from({length:6},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function fmtShort(d){return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"});}
function fmtLong(d){return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"});}
function fmtDate(s){if(!s)return"—";const d=new Date(s+"T00:00");return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pill(t,c){return`<span class="pill ${c}">${t}</span>`;}
function statusPill(s){const c=STATUSES[s]||STATUSES["EN_ATTENTE"];return pill(c.label,c.pill);}
function prioPill(p){const c=PRIOS[p]||PRIOS["NORMAL"];return pill(p,c.pill);}
function nextOF(){
  if(!S.orders.length)return"OF-001";
  const mx=Math.max(...S.orders.map(o=>parseInt(o.id.replace("OF-",""))||0));
  return"OF-"+String(mx+1).padStart(3,"0");
}
function nextBon(){
  if(!S.bons.length)return"BE-001";
  const mx=Math.max(...S.bons.map(b=>parseInt(b.id.replace("BE-",""))||0));
  return"BE-"+String(mx+1).padStart(3,"0");
}
function emptyForm(){
  return{client:"",deadline:"",rep:"",paymentTerms:"",
    lines:Array.from({length:10},(_,i)=>({id:i+1,ref:"",dim:"",largeur:"",designation:"",color:"",colorCustom:"",qty:"",unit:UNIT_FIXED,unitPrice:""}))};
}
function buildDesignation(ref,dim,largeur,color,colorCustom){
  if(!ref)return"";
  const parts=[];
  const finalColor=color==="Personnalisée"?(colorCustom||"Personnalisée"):color;
  if(ref.startsWith("P-")){
    parts.push("Poignée");
    parts.push(ref.replace("P-",""));
    if(dim)parts.push(dim+"cm");
  } else if(ref.startsWith("F-")){
    parts.push("Façade");
    parts.push(ref.replace("F-",""));
    if(largeur)parts.push(largeur+"cm");
    if(dim)parts.push("H"+dim+"cm");
  } else {
    parts.push(ref);
    if(dim)parts.push(dim+"cm");
  }
  if(finalColor)parts.push(finalColor);
  return parts.join(" ");
}
function dimsOpts(cur){return DIMS.map(d=>d?`<option value="${d}"${cur===d?" selected":""}>${d} cm</option>`:`<option value="">— dim —</option>`).join("");}
function colorsOpts(cur){return COLORS.map(c=>c?`<option value="${c}"${cur===c?" selected":""}>${c}</option>`:`<option value="">— couleur —</option>`).join("");}

function lateOrders(){
  const t=new Date();t.setHours(0,0,0,0);
  return S.orders.filter(o=>!["TERMINÉ","ANNULÉ","APURÉ"].includes(o.status)&&new Date(o.deadline)<t);
}
function stats(){
  return{
    total:S.orders.length,
    enCours:S.orders.filter(o=>["LANCÉ","EN_COURS"].includes(o.status)).length,
    attente:S.orders.filter(o=>o.status==="EN_ATTENTE").length,
    retard:lateOrders().length,
  };
}
function refsOpts(cur){return`<option value="">—</option>`+REFS.map(r=>`<option value="${r}"${cur===r?" selected":""}>${r}</option>`).join("");}
function statusOpts(cur){return Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${cur===k?" selected":""}>${v.label}</option>`).join("");}
function lineTotal(l){return(parseFloat(l.qty)||0)*(parseFloat(l.unitPrice)||0);}
function orderTotal(lines){return(lines||[]).reduce((s,l)=>s+lineTotal(l),0);}
function dlLabel(dl){
  if(dl<0)return`<span style="color:var(--red);font-weight:700">−${Math.abs(dl)}j</span>`;
  if(dl===0)return`<span style="color:var(--amber);font-weight:700">Auj.</span>`;
  if(dl<=3)return`<span style="color:var(--amber)">J−${dl}</span>`;
  return`<span style="color:var(--text2)">J−${dl}</span>`;
}

// ─── TAB MANAGEMENT ───
function setTab(tab){
  S.tab=tab;S.planSel=null;S.openOf=null;S.openApur=null;
  const titles={
    dashboard:"Tableau de bord",new_order:"Nouvelle commande",orders:"Commandes",
    launch:"Lancement OF",planning:"Planning semaine",apurement:"Apurement & Clôture",bons:"Bons d'entrée magasin"
  };
  document.getElementById("page-title").textContent=titles[tab]||tab;
  document.querySelectorAll(".nav-item[data-tab],.bn-item[data-tab]").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===tab);
  });
  updateBadges();
  render();
}
function updateBadges(){
  const n=lateOrders().length;
  ["badge-late","badge-late-m"].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.style.display=n>0?"":"none";el.textContent=n;
  });
}

function renderOrders(){
  const flt=S.filter;
  const all=S.orders;
  const filtered=flt==="TOUS"?all:all.filter(o=>o.status===flt);
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let h=`<div class="filter-bar">
    ${["TOUS",...Object.keys(STATUSES)].map(s=>{
      const cnt=s==="TOUS"?all.length:all.filter(o=>o.status===s).length;
      return`<button class="fb${s===flt?" active":""}" onclick="S.filter='${s}';render()">${s==="TOUS"?"Toutes":STATUSES[s].label} (${cnt})</button>`;
    }).join("")}

  if(!sorted.length)return h+`<div class="card"><div class="empty"><i class="ti ti-inbox"></i><p>Aucune commande ici.</p></div></div>`;
  h+=`<div class="card" style="padding:0;overflow:hidden"><div class="table-scroll"><table style="min-width:700px"><thead><tr>

    ${sorted.map(o=>`<tr style="background:${lateOrders().find(l=>l.id===o.id)?"#FFF5F5":""}">
      <td style="font-weight:700">${o.id}</td>
      <td>${esc(o.client)}</td>
      <td class="hide-mobile" style="font-size:11px;color:var(--text3)">${o.date}</td>

  return h;

function renderPlanning(){
  const wd=getWeekDays(S.weekOff);
  const today=todayStr();
  const wS=wd[0].toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
  const wE=wd[5].toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
  const sel=S.planSel;
  const openOrders=S.orders.filter(o=>!["TERMINÉ","ANNULÉ","APURÉ"].includes(o.status));

  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-sm" onclick="S.weekOff--;S.planSel=null;render()"><i class="ti ti-chevron-left"></i> Préc.</button>
    <span style="font-weight:600;font-size:13px">
      ${S.weekOff===0?"Sem. en cours":S.weekOff<0?`Sem. −${Math.abs(S.weekOff)}`:`Sem. +${S.weekOff}`}
      &nbsp;—&nbsp;${wS} → ${wE}
    </span>
    <button class="btn btn-sm" onclick="S.weekOff++;S.planSel=null;render()">Suiv. <i class="ti ti-chevron-right"></i></button>
    ${S.weekOff!==0?`<button class="btn btn-sm" onclick="S.weekOff=0;S.planSel=null;render()">Aujourd'hui</button>`:""}

  if(sel){
    const cell=S.plan[sel.key]||{};
    h+=`<div class="assign-panel">
      <div style="font-weight:700;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <i class="ti ti-edit" style="font-size:15px"></i>${WS.find(w=>w.id===sel.wsId)?.name} — ${sel.dayLabel}
      </div>
      <div class="assign-grid">
        <div class="form-group"><label>Ordre de fabrication</label>
          <select id="as-of">
            <option value="">— Effacer —</option>
            ${openOrders.map(o=>`<option value="${o.id}"${cell.ofId===o.id?" selected":""}>${o.id} — ${esc(o.client)} (${o.deadline})</option>`).join("")}

        </div>
        <div class="form-group"><label>Heures</label><input type="number" id="as-h" value="${cell.hours||""}" min="0" max="24" step=".5" placeholder="h"></div>
        <div class="form-group"><label>Note</label><input type="text" id="as-note" value="${esc(cell.notes||"")}" placeholder="Ex: setup + run"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="planSave()"><i class="ti ti-check"></i>Enregistrer</button>
        <button class="btn btn-red btn-sm" onclick="planClear()"><i class="ti ti-trash"></i>Effacer</button>
        <button class="btn btn-sm" onclick="S.planSel=null;render()">Annuler</button>
      </div>
    </div>`;
  }

  h+=`<div class="plan-scroll"><table class="plan-table" style="width:100%"><thead><tr>
    <th style="text-align:left;min-width:130px;position:sticky;left:0;z-index:2;background:var(--surface2)">Poste</th>
    ${wd.map(d=>{const isT=isoDate(d)===today;return`<th class="${isT?"today-h":""}">${fmtShort(d)}</th>`;}).join("")}
  </tr></thead><tbody>
    ${WS.map(ws=>`<tr>
      <td class="ws-col" style="position:sticky;left:0;z-index:1">${ws.name}</td>
      ${wd.map(d=>{
        const ds=isoDate(d);const key=ws.id+"_"+ds;
        const cell=S.plan[key];const isT=ds===today;const isSel=sel&&sel.key===key;
        return`<td class="pcell${isSel?" sel":""}${isT?" today-c":""}" onclick="planClick('${ws.id}','${ds}','${key}','${esc(fmtLong(d))}')">
          ${cell?`<div class="cell-of">${cell.ofId}</div>${cell.hours?`<div class="cell-h">${cell.hours}h</div>`:""}${cell.notes?`<div class="cell-note">${esc(cell.notes)}</div>`:""}`:""}

  <p style="font-size:11px;color:var(--text3);margin-top:8px">Cliquez sur une case pour affecter ou modifier un OF.</p>`;

function renderApurement(){
  const eligible=S.orders.filter(o=>["LANCÉ","EN_COURS","TERMINÉ"].includes(o.status));
  if(!eligible.length)return`<div class="card"><div class="empty"><i class="ti ti-checkup-list"></i><p>Aucune commande éligible à l'apurement.<br>Lancez d'abord des ordres de fabrication.</p></div></div>`;
  let h=`<p style="font-size:12px;color:var(--text2);margin-bottom:12px">L'apurement clôture un OF, confirme les quantités produites, valorise le stock et génère un bon d'entrée magasin.</p>`;
  h+=eligible.map(o=>{
    const isOpen=S.openApur===o.id;
    const activeLines=(o.lines||[]).filter(l=>l.ref);
    return`<div class="apur-card">
      <div class="apur-header" onclick="S.openApur=S.openApur==='${o.id}'?null:'${o.id}';render()">
        <div style="display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap">
          <span style="font-weight:700;font-size:14px">${o.id}</span>
          <span style="flex:1;font-size:13px">${esc(o.client)}</span>
          ${dlLabel(daysLeft(o.deadline))} ${statusPill(o.status)}
        </div>
        <i class="ti ti-chevron-${isOpen?"up":"down"}" style="color:var(--text3);font-size:16px;flex-shrink:0"></i>
      </div>
      ${isOpen?renderApurBody(o,activeLines):""}
    </div>`;
  }).join("");
  return h;
}

function renderApurBody(o,lines){
  const apData=o.apurData||{};
  const currency=o.currency||"TND";
  let totalVal=0;
  lines.forEach(l=>{
    const qProd=parseFloat((apData[l.id]||{}).qtyProd||l.qty)||0;
    const pRef=parseFloat((apData[l.id]||{}).prixRef||l.unitPrice)||0;
    totalVal+=qProd*pRef;
  });
  return`<div class="apur-body">
    <div style="font-weight:600;font-size:12px;margin-bottom:10px">Quantités produites & valorisation</div>
    <div class="table-scroll"><table class="apur-table" style="min-width:480px"><thead><tr>
      <th>Réf</th><th>Désignation</th><th>Qté commandée</th><th>Qté produite</th><th>Prix réf. (${currency})</th><th style="text-align:right">Valeur HT</th>
    </tr></thead><tbody>
      ${lines.map(l=>{
        const ap=apData[l.id]||{};
        const qP=parseFloat(ap.qtyProd||l.qty)||0;
        const pR=parseFloat(ap.prixRef||l.unitPrice)||0;
        const val=qP*pR;
        return`<tr>
          <td style="font-weight:600">${l.ref}</td>
          <td style="font-size:12px">${esc(l.designation)||"—"}</td>
          <td style="color:var(--text2)">${l.qty} ${l.unit}</td>
          <td><input type="number" class="apur-qty" data-oid="${o.id}" data-lid="${l.id}" value="${ap.qtyProd!==undefined?ap.qtyProd:l.qty}" min="0" step="any" style="font-size:12px;width:90px"></td>
          <td><input type="number" class="apur-prix" data-oid="${o.id}" data-lid="${l.id}" value="${ap.prixRef!==undefined?ap.prixRef:l.unitPrice}" min="0" step="0.001" style="font-size:12px;width:90px"></td>
          <td style="text-align:right;font-weight:600;font-size:12px" id="apur-val-${o.id}-${l.id}">${val>0?val.toFixed(3):"—"}</td>
        </tr>`;
      }).join("")}
    </tbody><tfoot>
      <tr style="background:var(--surface2)">
        <td colspan="5" style="font-weight:700;font-size:13px;padding:8px 10px">Total valorisé (${currency})</td>
        <td style="text-align:right;font-weight:700;font-size:13px;padding:8px 10px" id="apur-total-${o.id}">${totalVal>0?totalVal.toFixed(3):"—"}</td>
      </tr>
    </tfoot></table></div>

    <div class="form-group" style="max-width:300px;margin-top:12px">
      <label>Date de production / clôture</label>
      <input type="date" id="apur-date-${o.id}" value="${apData.dateProduction||todayStr()}">
    </div>

    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-purple" onclick="apurerOF('${o.id}')"><i class="ti ti-checkup-list"></i>Apurer & Générer bon d'entrée</button>
      <button class="btn btn-sm" onclick="saveApurDraft('${o.id}')"><i class="ti ti-device-floppy"></i>Sauvegarder brouillon</button>
    </div>

    <div class="bon-preview" id="bon-preview-${o.id}" style="display:none"></div>
  </div>`;
}

// ═══════════════════════════════════════════
// ─── BONS D'ENTRÉE ───
// ═══════════════════════════════════════════
function renderBons(){
  if(!S.bons.length)return`<div class="card"><div class="empty"><i class="ti ti-package"></i><p>Aucun bon d'entrée généré.<br>Apurez des commandes pour créer des bons d'entrée magasin.</p></div></div>`;
  const sorted=[...S.bons].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let h=`<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:var(--text2)">${S.bons.length} bon${S.bons.length>1?"s":""} d'entrée — valeur totale : <strong>${S.bons.reduce((s,b)=>s+(b.totalValue||0),0).toFixed(3)} (multi-devises)</strong></span>
    <button class="btn btn-sm" onclick="window.print()"><i class="ti ti-printer"></i>Imprimer</button>
  </div>`;
  h+=sorted.map(b=>bonCard(b)).join("");
  return h;
}

function bonCard(b,preview=false){
  const style=preview?"":`margin-bottom:12px`;
  return`<div class="bon-preview" style="${style}">
    <div class="bon-title"><i class="ti ti-package"></i>Bon d'entrée magasin — ${b.id}
      ${!preview?`<button class="btn btn-xs no-print" style="margin-left:auto" onclick="deleteBon('${b.id}')"><i class="ti ti-trash"></i></button>`:""}
    </div>
    <div class="bon-meta">
      <div><span>N° OF :</span> <strong>${b.ofId}</strong></div>
      <div><span>Client :</span> <strong>${esc(b.client)}</strong></div>
      <div><span>Date production :</span> <strong>${fmtDate(b.dateProduction)}</strong></div>
      <div><span>Date bon :</span> <strong>${fmtDate(b.date)}</strong></div>
      <div><span>Devise :</span> <strong>${b.currency}</strong></div>
      <div><span>Valeur totale :</span> <strong style="color:var(--teal)">${(b.totalValue||0).toFixed(3)} ${b.currency}</strong></div>
    </div>
    <table style="font-size:12px"><thead><tr>
      <th>Réf produit</th><th>Désignation</th><th>Couleur</th><th>Qté entrée</th><th>Unité</th><th>Prix unit.</th><th style="text-align:right">Valeur HT</th>
    </tr></thead><tbody>
      ${(b.lines||[]).map(l=>`<tr>
        <td style="font-weight:600">${l.ref}</td>
        <td>${esc(l.designation)||"—"}</td>
        <td>${esc(l.color)||"—"}</td>
        <td style="font-weight:600">${l.qtyProd} ${l.unit}</td>
        <td>${l.unit}</td>
        <td>${parseFloat(l.prixRef||0).toFixed(3)}</td>
        <td style="text-align:right;font-weight:600">${((parseFloat(l.qtyProd)||0)*(parseFloat(l.prixRef)||0)).toFixed(3)}</td>
      </tr>`).join("")}
    </tbody><tfoot>
      <tr style="background:var(--surface2)">
        <td colspan="6" style="font-weight:700;padding:8px 10px">Total valorisé</td>
        <td style="text-align:right;font-weight:700;padding:8px 10px">${(b.totalValue||0).toFixed(3)} ${b.currency}</td>
      </tr>
    </tfoot></table>
  </div>`;
}

// ─── ACTIONS ───
// ═══════════════════════════════════════════
function setOrderStatus(oid,status){
  S.orders=S.orders.map(o=>o.id===oid?{...o,status}:o);
  saveOrders();updateBadges();
}

function resetForm(){S.form=emptyForm();render();}

function readForm(){
  ["client","deadline","rep","paymentTerms"].forEach(id=>{
    const el=document.getElementById("f-"+id);if(el)S.form[id]=el.value;
  });
  document.querySelectorAll("[data-lid]").forEach(el=>{
    const lid=parseInt(el.dataset.lid),lf=el.dataset.lf;
    const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
    line[lf]=el.value;
  });
  S.form.lines.forEach(l=>{
    l.unit=UNIT_FIXED;
    if(!l.ref.startsWith("F-"))l.largeur="";
    l.designation=buildDesignation(l.ref,l.dim,l.largeur,l.color,l.colorCustom);
  });
}

function submitOrder(){
  readForm();
  const f=S.form;
  const lines=f.lines.filter(l=>l.ref&&l.qty).map(l=>({
    ...l,
    unit:UNIT_FIXED,
    designation:l.designation||buildDesignation(l.ref,l.dim,l.color),
  }));
  if(!f.client||!f.deadline||!lines.length){
    alert("Obligatoire : client, délai, et au moins une ligne avec référence + quantité.");return;
  }
  const order={
    id:nextOF(),date:todayStr(),createdAt:new Date().toISOString(),
    client:f.client,deadline:f.deadline,rep:f.rep,paymentTerms:f.paymentTerms,
    lines,status:"EN_ATTENTE",
  };
  S.orders=[...S.orders,order];
  saveOrders();
  S.form=emptyForm();
  setTab("orders");
}

function launchOF(oid){
  // Collect ws assignments
  const wsAssign={};
  document.querySelectorAll(`.ws-date[data-oid="${oid}"],.ws-hours[data-oid="${oid}"]`).forEach(el=>{
    const wsid=el.dataset.wsid;
    if(!wsAssign[wsid])wsAssign[wsid]={};
    if(el.classList.contains("ws-date"))wsAssign[wsid].startDate=el.value;
    else wsAssign[wsid].hours=el.value;
  });
  // Filter empty
  const filled=Object.fromEntries(Object.entries(wsAssign).filter(([,v])=>v.startDate||v.hours));
  S.orders=S.orders.map(o=>o.id===oid?{...o,status:"LANCÉ",wsAssign:filled,launchedAt:new Date().toISOString()}:o);
  saveOrders();
  S.openOf=null;
  updateBadges();
  render();
  // Optional: sync to planning
  const o=S.orders.find(x=>x.id===oid);
  if(o)Object.entries(filled).forEach(([wsid,v])=>{
    if(v.startDate){
      const key=wsid+"_"+v.startDate;
      S.plan[key]={ofId:oid,hours:v.hours||"",notes:""};
    }
  });
  savePlan();
}

function planClick(wsId,ds,key,dayLabel){
  if(S.planSel&&S.planSel.key===key){S.planSel=null;render();return;}
  S.planSel={wsId,key,dayLabel};render();
}
function planSave(){
  if(!S.planSel)return;
  const ofId=document.getElementById("as-of")?.value;
  const hours=document.getElementById("as-h")?.value;
  const notes=document.getElementById("as-note")?.value;
  if(!ofId){planClear();return;}
  S.plan={...S.plan,[S.planSel.key]:{ofId,hours,notes}};
  savePlan();S.planSel=null;render();
}
function planClear(){
  if(!S.planSel)return;
  delete S.plan[S.planSel.key];
  savePlan();S.planSel=null;render();
}

function collectApurData(oid){
  const data={};
  document.querySelectorAll(`.apur-qty[data-oid="${oid}"],.apur-prix[data-oid="${oid}"]`).forEach(el=>{
    const lid=parseInt(el.dataset.lid);
    if(!data[lid])data[lid]={};
    if(el.classList.contains("apur-qty"))data[lid].qtyProd=el.value;
    else data[lid].prixRef=el.value;
  });
  const dateEl=document.getElementById(`apur-date-${oid}`);
  const dateProduction=dateEl?dateEl.value:todayStr();
  return{data,dateProduction};
}

function saveApurDraft(oid){
  const{data,dateProduction}=collectApurData(oid);
  S.orders=S.orders.map(o=>o.id===oid?{...o,apurData:{...data,dateProduction}}:o);
  saveOrders();
  alert("Brouillon sauvegardé.");
}

function apurerOF(oid){
  const{data,dateProduction}=collectApurData(oid);
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  const activeLines=(o.lines||[]).filter(l=>l.ref);
  const bonLines=activeLines.map(l=>{
    const ap=data[l.id]||{};
    return{...l,qtyProd:ap.qtyProd!==undefined?ap.qtyProd:l.qty,prixRef:ap.prixRef!==undefined?ap.prixRef:l.unitPrice};
  }).filter(l=>parseFloat(l.qtyProd)>0);
  if(!bonLines.length){alert("Aucune quantité produite saisie.");return;}
  const totalValue=bonLines.reduce((s,l)=>(parseFloat(l.qtyProd)||0)*(parseFloat(l.prixRef)||0)+s,0);
  const bon={
    id:nextBon(),ofId:oid,client:o.client,currency:o.currency||"TND",
    date:todayStr(),dateProduction,totalValue,lines:bonLines,
  };
  S.bons=[...S.bons,bon];
  saveBons();
  S.orders=S.orders.map(x=>x.id===oid?{...x,status:"APURÉ",apurData:{...data,dateProduction},bonId:bon.id}:x);
  saveOrders();
  S.openApur=null;
  updateBadges();
  // Show preview
  render();
  setTimeout(()=>{
    const prev=document.getElementById(`bon-preview-${oid}`);
    if(prev){prev.style.display="block";prev.innerHTML=bonCard(bon,true);}
  },100);
}

function deleteBon(id){
  if(!confirm("Supprimer ce bon d'entrée ?"))return;
  S.bons=S.bons.filter(b=>b.id!==id);
  saveBons();render();
}

// ─── LIVE TOTALS for order form ───
function attachFormListeners(){
  if(S.tab!=="new_order")return;

  function updateDesignation(lid){
    const refEl=document.querySelector(`.ref-sel[data-lid="${lid}"]`);
    const dimSelEl=document.querySelector(`.dim-sel[data-lid="${lid}"]`);
    const dimInpEl=document.querySelector(`.dim-inp[data-lid="${lid}"]`);
    const largeurEl=document.querySelector(`.largeur-inp[data-lid="${lid}"]`);
    const colorEl=document.querySelector(`.color-inp[data-lid="${lid}"]`);
    const colorCustomEl=document.querySelector(`.color-custom[data-lid="${lid}"]`);

    const ref=refEl?refEl.value:"";
    const isFacade=ref.startsWith("F-");
    const color=colorEl?colorEl.value:"";
    const colorCustom=colorCustomEl?colorCustomEl.value.trim():"";

    // Toggle dim: select for P-, text input for F-
    if(dimSelEl)dimSelEl.style.display=isFacade?"none":"block";
    if(dimInpEl){
      dimInpEl.style.display=isFacade?"block":"none";
      if(!isFacade)dimInpEl.value="";
    }
    const dim=isFacade?(dimInpEl?dimInpEl.value.trim():""):(dimSelEl?dimSelEl.value:"");

    // Show/hide custom color input
    if(colorCustomEl)colorCustomEl.style.display=color==="Personnalisée"?"block":"none";

    // Enable/disable largeur based on ref type
    if(largeurEl){
      largeurEl.disabled=!isFacade;
      largeurEl.placeholder=isFacade?"ex: 60":"—";
      largeurEl.style.background=isFacade?"":"var(--surface2)";
      largeurEl.style.color=isFacade?"":"var(--text3)";
      if(!isFacade)largeurEl.value="";
    }
    const largeur=largeurEl&&!largeurEl.disabled?largeurEl.value.trim():"";

    const desig=buildDesignation(ref,dim,largeur,color,colorCustom);
    const line=S.form.lines.find(l=>l.id===lid);
    if(line){line.ref=ref;line.dim=dim;line.largeur=largeur;line.color=color;line.colorCustom=colorCustom;line.designation=desig;}
    const inp=document.querySelector(`.desig-inp[data-lid="${lid}"]`);
    if(inp)inp.value=desig;
    updateLineTotals(lid);
  }

  function updateLineTotals(lid){
    const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
    const isFacade=line.ref.startsWith("F-");
    const q=parseFloat(line.qty)||0;
    const nbPcs=isFacade?q:q*25;
    // Update the nb-pcs cell for this line
    const nbCell=document.querySelector(`.nb-pcs[data-lid="${lid}"]`)||
      document.querySelector(`[data-lid="${lid}"].nb-pcs`);
    // Find nb-pcs in same row
    const qtyEl=document.querySelector(`[data-lid="${lid}"][data-lf="qty"]`);
    if(qtyEl){
      const row=qtyEl.closest("tr");
      if(row){
        const nb=row.querySelector(".nb-pcs");
        if(nb){nb.textContent=q>0?nbPcs.toLocaleString("fr-FR"):"—";nb.dataset.facade=isFacade;}
      }
    }
    // Refresh both footer totals from state
    const totalP=S.form.lines.filter(l=>l.ref.startsWith("P-")).reduce((s,l)=>s+(parseFloat(l.qty)||0)*25,0);
    const totalF=S.form.lines.filter(l=>l.ref.startsWith("F-")).reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
    const elP=document.getElementById("total-pcs-poignees");
    const elF=document.getElementById("total-pcs-facades");
    if(elP)elP.textContent=totalP>0?totalP.toLocaleString("fr-FR"):"—";
    if(elF)elF.textContent=totalF>0?totalF.toLocaleString("fr-FR"):"—";
  }

  document.querySelectorAll("[data-lid]").forEach(el=>{
    const lf=el.dataset.lf;
    if(lf==="designation")return;
    const handler=()=>{
      const lid=parseInt(el.dataset.lid);
      const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
      line[lf]=el.value;
      if(["ref","dim","color","largeur","colorCustom"].includes(lf))updateDesignation(lid);
      if(lf==="qty")updateLineTotals(lid);
    };
    el.addEventListener("input",handler);
    el.addEventListener("change",handler);
  });

  ["client","deadline","rep","paymentTerms"].forEach(id=>{
    const el=document.getElementById("f-"+id);
    if(el)el.addEventListener("input",()=>{S.form[id]=el.value;});
    if(el)el.addEventListener("change",()=>{S.form[id]=el.value;});
  });
}

// Live apur totals
function attachApurListeners(){
  document.querySelectorAll(".apur-qty,.apur-prix").forEach(el=>{
    el.addEventListener("input",()=>{
      const oid=el.dataset.oid,lid=parseInt(el.dataset.lid);
      const o=S.orders.find(x=>x.id===oid);if(!o)return;
      const line=(o.lines||[]).find(l=>l.id===lid);if(!line)return;
      // find partner
      const row=el.closest("tr");
      const allInputs=row?row.querySelectorAll("input"):[];
      let qty=0,prix=0;
      allInputs.forEach(i=>{if(i.classList.contains("apur-qty"))qty=parseFloat(i.value)||0;if(i.classList.contains("apur-prix"))prix=parseFloat(i.value)||0;});
      const val=qty*prix;
      const valCell=document.getElementById(`apur-val-${oid}-${lid}`);
      if(valCell)valCell.textContent=val>0?val.toFixed(3):"—";
      // recalc total
      let total=0;
      document.querySelectorAll(`.apur-qty[data-oid="${oid}"]`).forEach(qi=>{
        const lid2=parseInt(qi.dataset.lid);
        const pi=document.querySelector(`.apur-prix[data-oid="${oid}"][data-lid="${lid2}"]`);
        if(pi)total+=(parseFloat(qi.value)||0)*(parseFloat(pi.value)||0);
      });
      const totCell=document.getElementById(`apur-total-${oid}`);
      if(totCell)totCell.textContent=total>0?total.toFixed(3):"—";
    });
  });
}

// ─── RENDER DISPATCHER ───
function render(){
  const el=document.getElementById("content");
  if(S.tab==="dashboard")el.innerHTML=renderDashboard();
  else if(S.tab==="new_order")el.innerHTML=renderNewOrder();
  else if(S.tab==="orders")el.innerHTML=renderOrders();
  else if(S.tab==="launch")el.innerHTML=renderLaunch();
  else if(S.tab==="planning")el.innerHTML=renderPlanning();
  else if(S.tab==="apurement")el.innerHTML=renderApurement();
  else if(S.tab==="bons")el.innerHTML=renderBons();

  // Attach status selects
  document.querySelectorAll(".st-sel[data-oid]").forEach(sel=>{
    sel.addEventListener("change",()=>{setOrderStatus(sel.dataset.oid,sel.value);render();});
  });
  attachFormListeners();
  attachApurListeners();
}

// ─── INIT ───
document.getElementById("topbar-date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
document.querySelectorAll(".nav-item[data-tab],.bn-item[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

// Afficher bannière de statut de connexion
(function(){
  const bar=document.createElement("div");
  bar.style.cssText=`position:fixed;bottom:${window.innerWidth<=768?"65px":"8px"};right:8px;z-index:999;
    padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
    background:${FB_ACTIVE?"#E1F5EE":"#FAEEDA"};color:${FB_ACTIVE?"#0F6E56":"#7A470A"};
    border:1px solid ${FB_ACTIVE?"#1D9E75":"#FAC775"};`;
  bar.textContent=FB_ACTIVE?"🔥 Firebase — données partagées":"💾 Local — données non partagées";
  document.body.appendChild(bar);
  setTimeout(()=>bar.remove(),5000);
})();

// Afficher écran de chargement puis lancer
document.getElementById("content").innerHTML=`
  <div style="padding:3rem;text-align:center;color:var(--text3)">
    <div style="font-size:32px;margin-bottom:12px">⏳</div>
    <div style="font-size:14px">${FB_ACTIVE?"Connexion à Firebase…":"Chargement…"}</div>
  </div>`;

loadAll().then(()=>{
  updateBadges();
  render();
});
</script>
</body>
</html>
