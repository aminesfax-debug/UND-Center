<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UND Atelier">
<meta name="theme-color" content="#17171A">
<link rel="apple-touch-icon" href="icon.png">
<title>Atelier — Suivi Production</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#FFF;--surface2:#F4F3EF;--surface3:#ECEAE5;
  --border:#DDDBD5;--border2:#C8C6BF;
  --text:#1A1A17;--text2:#6A6A65;--text3:#A8A8A3;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-mid:#1D9E75;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --amber:#7A470A;--amber-bg:#FAEEDA;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --gray:#5F5E5A;--gray-bg:#F1EFE8;
  --r:8px;--rl:12px;--rxl:16px;
  --sidebar:210px;--bottombar:60px;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--surface2);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ─── LAYOUT ─── */
.app{display:flex;min-height:100vh}

/* SIDEBAR desktop */
.sidebar{width:var(--sidebar);background:#17171A;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.brand{padding:18px 16px 16px;border-bottom:1px solid #2C2C2F;margin-bottom:6px}
.brand-name{color:#FFF;font-size:15px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.brand-name i{font-size:18px;color:#1D9E75}
.brand-sub{color:#666;font-size:11px;margin-top:2px}
.nav-section{padding:4px 10px 2px;font-size:10px;color:#444;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;color:#888;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;border-radius:var(--r);margin:1px 6px;width:calc(100% - 12px);transition:all .12s}
.nav-item i{font-size:15px;flex-shrink:0}
.nav-item:hover{color:#CCC;background:#23232A}
.nav-item.active{color:#FFF;background:#2A2A32;font-weight:500}
.nav-sub{padding-left:30px;font-size:12px;color:#666}
.nav-sub.active{color:#CCC;background:#23232A}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px}
.content{padding:20px;flex:1}

/* BOTTOM NAV mobile */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#17171A;border-top:1px solid #2C2C2F;z-index:100;height:var(--bottombar)}
.bottomnav-inner{display:flex;height:100%}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#666;font-size:9px;border:none;background:none;cursor:pointer;padding:4px 0;position:relative}
.bn-item i{font-size:18px}
.bn-item.active{color:#1D9E75}
.bn-item .badge{position:absolute;top:5px;right:calc(50% - 14px);background:#A32D2D;color:#FFF;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px}

/* ─── COMPONENTS ─── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.stat-ico{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:17px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:28px;font-weight:700;letter-spacing:-1.5px;line-height:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.card-title i{font-size:15px;color:var(--text3)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--text2);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAF8}

.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.st-wait{background:var(--surface2);color:var(--text2)}
.st-run{background:var(--teal-bg);color:var(--teal)}
.st-done{background:var(--green-bg);color:var(--green)}
.st-late{background:var(--red-bg);color:var(--red)}
.st-cancel{background:var(--gray-bg);color:var(--gray)}
.st-launched{background:var(--purple-bg);color:var(--purple)}
.st-apure{background:var(--amber-bg);color:var(--amber)}
.pr-urgent{background:var(--red-bg);color:var(--red)}
.pr-normal{background:var(--blue-bg);color:var(--blue)}
.pr-low{background:var(--gray-bg);color:var(--gray)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .12s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:#17171A;color:#FFF;border-color:#17171A}
.btn-primary:hover{background:#2C2C32}
.btn-teal{background:var(--teal);color:#FFF;border-color:var(--teal)}
.btn-teal:hover{background:#0A5040}
.btn-purple{background:var(--purple);color:#FFF;border-color:var(--purple)}
.btn-purple:hover{background:#3C3489}
.btn-red{background:var(--red-bg);color:var(--red);border-color:#F09595}
.btn-red:hover{background:#F7C1C1}
.btn-sm{font-size:12px;padding:5px 11px}
.btn-xs{font-size:11px;padding:3px 9px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--surface);color:var(--text);width:100%;font-size:13px;transition:border .15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:#17171A;box-shadow:0 0 0 2px rgba(23,23,26,.06)}
textarea{resize:vertical}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fb{padding:5px 13px;font-size:12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;font-weight:500}
.fb.active{background:#17171A;color:#FFF;border-color:#17171A}
.fb:hover:not(.active){background:var(--surface3)}

.alert-banner{background:var(--red-bg);border:1px solid #F09595;border-radius:var(--rl);overflow:hidden;margin-bottom:16px}
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F7C1C1;background:var(--surface);flex-wrap:wrap}
.alert-row:last-child{border-bottom:none}

/* planning */
.plan-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.plan-table{border-collapse:collapse;min-width:760px}
.plan-table th{font-size:11px;font-weight:600;color:var(--text2);padding:7px 8px;text-align:center;border:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.plan-table th.today-h{color:var(--blue);border-bottom:2px solid var(--blue)}
.ws-col{font-size:12px;font-weight:600;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;min-width:130px;color:var(--text)}
.pcell{padding:5px 6px;border:1px solid var(--border);min-width:100px;height:50px;vertical-align:top;cursor:pointer;transition:background .1s;background:var(--surface)}
.pcell:hover{background:#F0F8FF}
.pcell.sel{background:#EBF4FF;border-color:var(--blue)}
.pcell.today-c{border-left:2px solid var(--blue)}
.cell-of{font-weight:700;font-size:10px;color:var(--teal)}
.cell-h{font-size:10px;color:var(--text3)}
.cell-note{font-size:10px;color:var(--text3);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.assign-panel{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--rl);padding:14px 18px;margin-bottom:14px}
.assign-grid{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:end;margin-bottom:10px}

/* OF launch */
.of-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.of-card-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .12s}
.of-card-header:hover{background:var(--surface2)}
.of-card-body{padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2)}
.of-lines-table th,.of-lines-table td{font-size:12px;padding:6px 10px}
.ws-assign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.ws-assign-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.ws-assign-item label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}

/* apurement */
.apur-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.apur-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .12s}
.apur-header:hover{background:var(--surface2)}
.apur-body{padding:14px 16px;border-top:1px solid var(--border)}
.apur-table th,.apur-table td{font-size:12px;padding:6px 10px}
.bon-preview{background:var(--surface);border:2px dashed var(--border2);border-radius:var(--rl);padding:18px;margin-top:12px}
.bon-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px}
.bon-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:12px}
.bon-meta span{color:var(--text2)}

/* empty state */
.empty{padding:2.5rem;text-align:center;color:var(--text3)}
.empty i{font-size:36px;display:block;margin-bottom:8px;opacity:.4}
.empty p{font-size:13px}

/* mobile */
.mobile-line-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.mlc-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--surface2)}
.mlc-num{width:26px;height:26px;background:#17171A;color:#FFF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.mlc-summary{flex:1;font-size:13px;color:var(--text2)}
.mlc-summary strong{color:var(--text);display:block;font-size:13px}
.mlc-pcs{font-size:13px;font-weight:700;color:var(--teal);white-space:nowrap}
.mlc-body{padding:14px;display:none;border-top:1px solid var(--border)}
.mlc-body.open{display:block}
.mlc-row{margin-bottom:10px}
.mlc-row label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.mlc-row input,.mlc-row select{font-size:15px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border2);width:100%;background:var(--surface);color:var(--text)}
.mlc-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mlc-computed{display:flex;justify-content:space-between;background:var(--surface2);border-radius:var(--r);padding:10px 12px;margin-top:4px;font-size:12px}
.mlc-computed span:last-child{font-weight:700;color:var(--teal)}
.mobile-lines{display:none}
.desktop-lines{display:block}
@media(max-width:768px){
.mobile-lines{display:block}
.desktop-lines{display:none}

  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:var(--bottombar)}
  .bottomnav{display:block}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:12px}
  .stat-val{font-size:24px}
  .content{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .assign-grid{grid-template-columns:1fr;gap:8px}
  .card{padding:12px 14px}
  th,td{padding:7px 9px}
  .btn{padding:7px 12px;font-size:12px}
  .topbar{padding:0 14px}
  .ws-assign-grid{grid-template-columns:1fr 1fr}
  .bon-meta{grid-template-columns:1fr}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-scroll table{min-width:580px}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .ws-assign-grid{grid-template-columns:1fr}
  .table-scroll table{min-width:480px}
}

/* hide on mobile for tables */
.hide-mobile{display:table-cell}
@media(max-width:600px){.hide-mobile{display:none}}

/* print */
@media print{
  .sidebar,.bottomnav,.topbar,.no-print{display:none!important}
  .main{margin:0}
  .bon-preview{border:1px solid #999;page-break-inside:avoid}
  .content{padding:10px}
}
</style>
</head>

<div class="app">
  <!-- SIDEBAR desktop -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name"><i class="ti ti-settings-2"></i>Atelier</div>
      <div class="brand-sub">Suivi de production</div>

    <button class="nav-item nav-sub" data-tab="pending"><i class="ti ti-bell-ringing"></i>Demandes web <span class="badge" id="badge-pending" style="display:none;background:#185FA5">0</span></button>
    <button class="nav-item nav-sub" data-tab="orders" data-sub="articles" id="sub-articles"><i class="ti ti-article"></i>Articles commandés</button>

    <div class="nav-section">Production</div>
    <button class="nav-item" data-tab="launch"><i class="ti ti-rocket"></i>Lancement OF</button>
    <button class="nav-item" data-tab="planning"><i class="ti ti-calendar-week"></i>Planning</button>
    <div class="nav-section">Stock</div>
    <button class="nav-item" data-tab="apurement"><i class="ti ti-checkup-list"></i>Apurement</button>
    <button class="nav-item" data-tab="bons"><i class="ti ti-package"></i>Bons d'entrée</button>

  <div class="main">
    <!-- TOP BAR -->
    <div class="topbar">
      <div>
        <div class="topbar-title" id="page-title">Tableau de bord</div>

      <div style="display:flex;gap:6px">

      <button class="btn btn-sm no-print" title="Configurer Slack" onclick="promptSlackWebhook()" style="padding:6px 8px"><i class="ti ti-brand-slack"></i></button>
      <div id="conn-indicator" title="Firebase" style="width:10px;height:10px;border-radius:50%;background:#888;flex-shrink:0;margin-left:4px" aria-hidden="true"></div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="content"></div>
  </div>

  <!-- BOTTOM NAV mobile -->
  <nav class="bottomnav">
    <div class="bottomnav-inner">
      <button class="bn-item active" data-tab="dashboard"><i class="ti ti-home-2"></i>Accueil</button>
      <button class="bn-item" data-tab="orders"><i class="ti ti-clipboard-list"></i>Commandes<span class="badge" id="badge-late-m" style="display:none">0</span></button>
      <button class="bn-item" data-tab="launch"><i class="ti ti-rocket"></i>Lancement</button>
      <button class="bn-item" data-tab="apurement"><i class="ti ti-checkup-list"></i>Apurement</button>
      <button class="bn-item" data-tab="planning"><i class="ti ti-calendar-week"></i>Planning</button>
    </div>
  </nav>
</div>

function calcHingeCount(height){
  if(height<=1000)return 2;
  if(height<=1600)return 3;
  if(height<=2400)return 4;
  return 5;
}
function calcHingePositions(count,height){
  if(count<1)return[];
  if(count===1)return[Math.round(height/2)];
  const first=135,last=height-135;
  if(count===2)return[first,last];
  const pos=[first];
  const step=(last-first)/(count-1);
  for(let i=1;i<count-1;i++)pos.push(Math.round(first+i*step));
  pos.push(last);
  return pos;
}
function buildFacadeDesignation(cfg){
  const m=FACADE_MODELS[cfg.model];if(!m)return cfg.model||"";
  const parts=[m.label];
  if(cfg.width&&cfg.height)parts.push(cfg.width+"×"+cfg.height+"mm");
  if(cfg.color)parts.push(cfg.color);
  if(cfg.handle&&cfg.handle.has){
    let h="Avec poignée";
    if(cfg.handle.type)h+=" en "+cfg.handle.type;
    if(cfg.handle.orientation)h+=" ("+cfg.handle.orientation+")";
    parts.push(h);
  }else if(m.handle==="fixed"){
    parts.push("Avec poignée");
  }
  if(cfg.glass&&cfg.glass.has&&cfg.glass.type)parts.push("Verre "+cfg.glass.type);
  if(cfg.hingesSupplied===false)parts.push("Sans charnières");
  return parts.join(" — ");
}
function emptyFacadeConfig(model){
  const m=FACADE_MODELS[model]||{};

    model,width:"",height:"",color:"",

    hingesSupplied:true,
    hingeCount:2,hingePositions:[135,865],
    glass:{has:false,type:"Transparent"},
    qty:1,notes:""
  };
}

const REMISE_POIGNEES=[
  {min:10000,max:Infinity,remise:35,bonusClients:["SOGIMPEX","EHC"],bonus:5},
  {min:3000,max:9999,remise:35},
  {min:1500,max:2999,remise:30},
  {min:500,max:1499,remise:25},
  {min:100,max:499,remise:20},
  {min:1,max:99,remise:10},
];
function getRemisePoignee(nbPcs,client){
  const r=REMISE_POIGNEES.find(x=>nbPcs>=x.min&&nbPcs<=x.max);
  if(!r)return {remise:0,bonus:0};
  const bonus=(r.bonusClients&&r.bonusClients.some(c=>client&&client.toUpperCase().includes(c)))?r.bonus||0:0;
  return {remise:r.remise,bonus};
}

// ─── PERSISTENCE ───
function ls_get(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function saveOrders(){

  else ls_set(K_ORDERS,S.orders);
}
function savePlan(){

  else ls_set(K_PLAN,S.plan);
}
function saveBons(){
  if(db) db.ref("bons").set(S.bons);
  else ls_set(K_BONS,S.bons);
}

function saveOfs(){
  if(db) db.ref("ofs").set(S.ofs);
  else ls_set(K_OFS,S.ofs);
}

async function loadAll(){
  if(db){
    // Helper: read with 8s timeout
    function fbRead(path){
      return Promise.race([
        db.ref(path).once("value").then(s=>s.val()),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))
      ]);
    }
    try{
      const [orders,plan,bons,ofs,pending]=await Promise.all([
        fbRead("orders").catch(()=>null),
        fbRead("plan").catch(()=>null),
        fbRead("bons").catch(()=>null),
        fbRead("ofs").catch(()=>null),
        fbRead("pending_orders").catch(()=>null),
      ]);
      // Normalize orders array and each order's lines (Firebase converts arrays to objects)
      const toArr=v=>Array.isArray(v)?v:(v?Object.values(v):[]);
      S.orders=toArr(orders).map(o=>({...o,lines:toArr(o.lines),facadeLines:toArr(o.facadeLines)}));
      S.plan=plan||{};
      S.bons=toArr(bons);
      S.ofs=toArr(ofs);
      S.pendingOrders=pending?Object.values(pending).map(o=>({...o,lines:toArr(o.lines)})):[];
    }catch(e){
      console.warn("Firebase load error:",e);
      S.orders=ls_get(K_ORDERS)||[];
      S.plan=ls_get(K_PLAN)||{};
      S.bons=ls_get(K_BONS)||[];
      S.ofs=ls_get(K_OFS)||[];
      S.pendingOrders=[];
    }
    // Real-time listeners
    db.ref("orders").on("value",snap=>{
      const v=snap.val();
      const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
      const arr=toA(v).map(o=>({...o,lines:toA(o.lines),facadeLines:toA(o.facadeLines)}));
      if(JSON.stringify(arr)!==JSON.stringify(S.orders)){S.orders=arr;updateBadges();render();}
    });
    db.ref("bons").on("value",snap=>{
      const v=snap.val();
      const arr=Array.isArray(v)?v:(v?Object.values(v):[]);
      if(JSON.stringify(arr)!==JSON.stringify(S.bons)){S.bons=arr;if(S.tab==="bons")render();}
    });
    db.ref("pending_orders").on("value",snap=>{
      const v=Object.values(snap.val()||{});
      if(JSON.stringify(v)!==JSON.stringify(S.pendingOrders)){S.pendingOrders=v;updateBadges();if(S.tab==="pending")render();}
    });
    try{db.ref("pending_orders").keepSynced(true);}catch(e){}
    db.ref(".info/connected").on("value",snap=>{
      const ok=snap.val();
      const el=document.getElementById("conn-indicator");
      if(el){el.style.background=ok?"#1D9E75":"#A32D2D";el.title=ok?"Firebase connecté":"Reconnexion en cours…";}
      if(ok){db.ref("pending_orders").once("value").then(s=>{
        const v=Object.values(s.val()||{});
        if(JSON.stringify(v)!==JSON.stringify(S.pendingOrders)){S.pendingOrders=v;updateBadges();if(S.tab==="pending")render();}
      }).catch(()=>{});}
    });
    setInterval(()=>{
      db.ref("pending_orders").once("value").then(s=>{
        const v=Object.values(s.val()||{});
        if(JSON.stringify(v)!==JSON.stringify(S.pendingOrders)){S.pendingOrders=v;updateBadges();if(S.tab==="pending")render();}
      }).catch(()=>{});
    },45000);
    document.addEventListener("visibilitychange",()=>{
      if(!document.hidden){
        db.ref("pending_orders").once("value").then(s=>{
          const v=Object.values(s.val()||{});
          if(JSON.stringify(v)!==JSON.stringify(S.pendingOrders)){S.pendingOrders=v;updateBadges();if(S.tab==="pending")render();}
        }).catch(()=>{});
      }
    });
  } else {
    S.orders=ls_get(K_ORDERS)||[];
    S.plan=ls_get(K_PLAN)||{};
    S.bons=ls_get(K_BONS)||[];
    S.ofs=ls_get(K_OFS)||[];
    S.pendingOrders=[];
  }
  S.form=emptyForm();
}

// ─── HELPERS ───
function isoDate(d){return d.toISOString().split("T")[0];}
function todayStr(){return isoDate(new Date());}
function daysLeft(dl){
  if(!dl)return null;
  if(isNaN(Date.parse(dl)))return null; // text deadline like "Immédiat", "3 jours"
  const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(dl)-t)/86400000);
}
function getWeekDays(off){
  const n=new Date(),dow=n.getDay();
  const mon=new Date(n);mon.setDate(n.getDate()-(dow===0?6:dow-1)+off*7);mon.setHours(0,0,0,0);
  return Array.from({length:6},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function fmtShort(d){return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"});}
function fmtLong(d){return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"});}
function fmtDate(s){if(!s)return"—";const d=new Date(s+"T00:00");return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pill(t,c){return`<span class="pill ${c}">${t}</span>`;}
function statusPill(s){const c=STATUSES[s]||STATUSES["EN_ATTENTE"];return pill(c.label,c.pill);}
function prioPill(p){const c=PRIOS[p]||PRIOS["NORMAL"];return pill(p,c.pill);}
function nextCde(){
  const now=new Date();
  const mm=String(now.getMonth()+1).padStart(2,"0");
  const prefix="Cde"+mm;
  const monthOrders=S.orders.filter(o=>o.id&&o.id.startsWith(prefix));
  if(!monthOrders.length)return prefix+"001";
  const mx=Math.max(...monthOrders.map(o=>parseInt(o.id.replace(prefix,""))||0));
  return prefix+String(mx+1).padStart(3,"0");
}
// Keep nextOF as alias for legacy OFs
function nextOF(){return nextCde();}
function nextBon(){
  if(!S.bons.length)return"BE-001";
  const mx=Math.max(...S.bons.map(b=>parseInt(b.id.replace("BE-",""))||0));
  return"BE-"+String(mx+1).padStart(3,"0");
}
function nextPF(){
  if(!S.ofs.length)return"PF-001";
  const mx=Math.max(...S.ofs.map(o=>parseInt(o.id.replace("PF-",""))||0));
  return"PF-"+String(mx+1).padStart(3,"0");
}
function emptyForm(){
  return{
    client:"",deadline:"",rep:"",paymentTerms:"",
    lines:Array.from({length:10},(_,i)=>({id:i+1,ref:"",dim:"",largeur:"",designation:"",color:"",colorCustom:"",qty:"",unit:UNIT_FIXED,prixTarif:"",remise:""})),
    facadeLines:[],
  };
}
function buildDesignation(ref,dim,largeur,color,colorCustom){
  if(!ref)return"";
  const parts=[];
  const finalColor=color==="Personnalisée"?(colorCustom||"Personnalisée"):color;
  if(ref.startsWith("P-")){
    parts.push("Poignée");
    parts.push(ref.replace("P-",""));
    if(dim)parts.push(dim+"cm");
  } else if(ref.startsWith("F-")||ref.startsWith("SKIN-")){
    const fm=FACADE_MODELS[ref];
    if(fm){parts.push(fm.label);}
    else{parts.push("Façade");parts.push(ref.replace("F-","").replace("SKIN-","Skin "));}
    if(largeur)parts.push(largeur+"cm");
    if(dim)parts.push("H"+dim+"cm");
  } else {
    parts.push(ref);
    if(dim)parts.push(dim+"cm");
  }
  if(finalColor)parts.push(finalColor);
  return parts.join(" ");
}
function dimsOpts(cur,ref){
  const has10=ref&&(ref==="P-240"||ref==="P-242");
  return DIMS.filter(d=>d===""||d!=="10"||has10).map(d=>d?`<option value="${d}"${cur===d?" selected":""}>${d} cm</option>`:`<option value="">— dim —</option>`).join("");
}
function colorsOpts(cur){
  const list=["Noir","Blanc","Moon light","Champagne","Personnalisée"];
  return['<option value="">— couleur —</option>'].concat(
    list.map(c=>'<option value="'+c+'"'+(cur===c?' selected':'')+'>'+c+'</option>')
  ).join("");
}

function lateOrders(){
  const t=new Date();t.setHours(0,0,0,0);
  return S.orders.filter(o=>!["TERMINÉ","ANNULÉ","APURÉ"].includes(o.status)&&new Date(o.deadline)<t);
}
function calcOrderCA(o){
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const lines=toA(o.lines).filter(l=>l&&l.ref&&l.qty);
  if(!lines.length)return 0;
  const totalP=lines.filter(l=>!isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const remiseInfo=getRemisePoignee(totalP,o.client);
  let ca=lines.reduce((s,l)=>{
    const nb=nbPcsFromLine(l);
    const pt=parseFloat(l.prixTarif)||0;
    const rm=isFacadeRef(l.ref)?parseFloat(l.remise)||0:remiseInfo.remise;
    return s+pt*(1-rm/100)*nb;
  },0);
  if(remiseInfo.bonus>0)ca*=(1-remiseInfo.bonus/100);
  return ca;
}

function stats(){
  try{
    const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
    const thisMonth=new Date().toISOString().slice(0,7);
    const filterMonth=S.dashFilter||"mois";
    const orders=S.orders||[];
    const filteredOrders=orders.filter(o=>o&&o.status!=="ANNULÉ"&&(filterMonth==="tout"||(o.date&&o.date.startsWith(thisMonth))));
    const totalPoigneesMois=filteredOrders.reduce((s,o)=>s+toA(o.lines).filter(l=>l&&l.ref&&l.ref.startsWith("P-")).reduce((s2,l)=>s2+nbPcsFromLine(l),0),0);
    const totalFacadesMois=filteredOrders.reduce((s,o)=>s+toA(o.lines).filter(l=>l&&l.ref&&!l.ref.startsWith("P-")).reduce((s2,l)=>s2+nbPcsFromLine(l),0),0);
    const caMois=filteredOrders.reduce((s,o)=>{try{return s+calcOrderCA(o);}catch(e){return s;}},0);
    return{
      total:orders.length,
      enCours:orders.filter(o=>o&&["LANCÉ","EN_COURS"].includes(o.status)).length,
      attente:orders.filter(o=>o&&o.status==="EN_ATTENTE").length,
      retard:lateOrders().length,
      totalPoigneesMois,totalFacadesMois,caMois,
      moisLabel:filterMonth==="tout"?"Tout":new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),
      filterMonth,
    };
  }catch(e){
    console.error("stats() error:",e);
    return{total:0,enCours:0,attente:0,retard:0,totalPoigneesMois:0,totalFacadesMois:0,caMois:0,moisLabel:"—",filterMonth:"mois"};
  }
}
function refsOpts(cur){return`<option value="">—</option>`+REFS.map(r=>`<option value="${r}"${cur===r?" selected":""}>${r}</option>`).join("");}
function statusOpts(cur){return Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${cur===k?" selected":""}>${v.label}</option>`).join("");}
function lineTotal(l){return(parseFloat(l.qty)||0)*(parseFloat(l.unitPrice)||0);}
function orderTotal(lines){return(lines||[]).reduce((s,l)=>s+lineTotal(l),0);}
function dlLabel(dl){
  if(dl===null||dl===undefined||isNaN(dl))return"";
  if(dl<0)return`<span style="color:var(--red);font-weight:700">−${Math.abs(dl)}j</span>`;
  if(dl===0)return`<span style="color:var(--amber);font-weight:700">Auj.</span>`;
  if(dl<=3)return`<span style="color:var(--amber)">J−${dl}</span>`;
  return`<span style="color:var(--text2)">J−${dl}</span>`;
}

// ─── TAB MANAGEMENT ───
function setTab(tab,sub){
  S.tab=tab;S.planSel=null;S.openOf=null;S.openApur=null;
  if(tab==="orders")S.subTab=sub||S.subTab||"articles";
  const titles={
    dashboard:"Tableau de bord",new_order:"Nouvelle commande",orders:S.subTab==="articles"?"Articles commandés":"Commandes clients",
    launch:"Lancement OF",planning:"Planning semaine",apurement:"Apurement & Clôture",bons:"Bons d'entrée magasin",pending:"Demandes web clients"
  };
  document.getElementById("page-title").textContent=titles[tab]||tab;
  document.querySelectorAll(".nav-item[data-tab],.bn-item[data-tab]").forEach(b=>{
    const isOrders=b.dataset.tab==="orders";
    const hasSub=b.dataset.sub;
    if(hasSub){
      b.classList.toggle("active",tab==="orders"&&S.subTab===b.dataset.sub);
    } else {
      b.classList.toggle("active",b.dataset.tab===tab&&!hasSub);
    }
  });
  updateBadges();
  render();
}
function updateBadges(){
  const n=lateOrders().length;
  ["badge-late","badge-late-m"].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.style.display=n>0?"":"none";el.textContent=n;
  });
  const p=S.pendingOrders.filter(o=>o.status==="EN_ATTENTE").length;
  const bp=document.getElementById("badge-pending");
  if(bp){bp.style.display=p>0?"":"none";bp.textContent=p;}
}
function acceptPendingOrder(id){
  const o=S.pendingOrders.find(x=>x.id===id);if(!o)return;
  // Calculate total poignées for remise
  const totalPoigneesCmd=(o.lines||[]).filter(l=>l.ref&&l.ref.startsWith("P-")).reduce((s,l)=>s+(parseFloat(l.nbPcs)||0),0);
  const remiseInfo=getRemisePoignee(totalPoigneesCmd,o.client);
  const remiseOverride=(S.remiseOverrides||{})[id];
  const remiseApplied=remiseOverride!==undefined?remiseOverride:remiseInfo.remise;
  // Apply remise to each line
  const linesWithRemise=(o.lines||[]).map(l=>{
    const isFacade=l.ref&&l.ref.startsWith("F-");
    const remise=isFacade?0:remiseApplied;
    const pt=parseFloat(l.prixTarif)||0;
    const puNet=pt*(1-remise/100);
    const nb=parseFloat(l.nbPcs)||0;
    return{...l,remise,puNet:puNet.toFixed(3),totalHT:(puNet*nb).toFixed(3)};
  });
  const newOrder={
    ...o,
    id:nextOF(),
    source:"WEB_CLIENT",
    status:"EN_ATTENTE",
    deadline:"Immédiat",
    lines:linesWithRemise,
    remisePoignees:remiseInfo.remise,
    bonusClient:remiseInfo.bonus,
  };
  S.orders=[...S.orders,newOrder];
  saveOrders();
  if(db)db.ref("pending_orders/"+id).remove();
  else{S.pendingOrders=S.pendingOrders.filter(x=>x.id!==id);}
  updateBadges();
  S.reviewId=null;
  if(S.remiseOverrides)delete S.remiseOverrides[id];
  sendSlackNotif(newOrder,"WEB");
  alert("✅ Commande "+newOrder.id+" intégrée — remise "+remiseApplied+"% appliquée."+(remiseInfo.bonus>0?" + "+remiseInfo.bonus+"% client privilégié.":""));
  setTab("orders","clients");
}
function rejectPendingOrder(id){
  if(!confirm("Rejeter cette demande ?"))return;
  if(db)db.ref("pending_orders/"+id).remove();
  else S.pendingOrders=S.pendingOrders.filter(x=>x.id!==id);
  updateBadges();render();
}

        <td><input type="number" data-lid="${l.id}" data-lf="prixTarif" value="${l.prixTarif||""}" step="0.001" min="0" class="prix-input" style="font-size:11px"></td>
        <td style="text-align:center">
          ${l.ref?`<span class="remise-auto" style="font-size:11px;font-weight:700;color:var(--teal)">${remiseVal}%</span>`:`<span style="color:var(--text3)">—</span>`}
        </td>

        <td style="text-align:right;font-weight:700;font-size:13px;padding:8px 12px;color:var(--teal)" id="total-pcs-poignees">—</td>
        <td colspan="4" style="text-align:right;font-weight:700;padding:8px 12px;color:var(--teal)" id="total-ht-poignees">—</td>

    </div><!-- end desktop-lines -->

    <!-- Liste des façades configurées -->
    ${f.facadeLines.length===0&&!(S.facadeConf&&S.facadeConf.open)?`
    <div style="padding:1.5rem;text-align:center;color:var(--text3);font-size:13px;font-style:italic">
      Aucune façade ajoutée — cliquez sur "Ajouter une façade" pour commencer
    </div>`:`
    <div>
      ${f.facadeLines.map((fl,i)=>`
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px">${i+1}. ${esc(fl.designation)}</div>
          <div style="font-size:11px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap">
            ${fl.facadeConfig.hingePositions&&fl.facadeConfig.hingePositions.length?`<span><i class="ti ti-tool" style="font-size:11px"></i> ${fl.facadeConfig.hingeCount} charnières ${fl.facadeConfig.hingesSupplied===false?"(non fournies)":"(fournies)"}</span>`:""}
            ${fl.facadeConfig.glass&&fl.facadeConfig.glass.has?`<span><i class="ti ti-rectangle" style="font-size:11px"></i> Verre ${fl.facadeConfig.glass.type}</span>`:""}

            <i class="ti ti-pencil"></i>
          </button>
          <button onclick="S.form.facadeLines.splice(${i},1);render()" style="padding:6px 10px;border-radius:var(--r);border:1px solid #F09595;background:var(--red-bg);cursor:pointer;font-size:12px;color:var(--red)">

      ${f.facadeLines.length>0?`

        <span style="font-weight:600;font-size:12px;color:var(--text2)"><i class="ti ti-layout-columns" style="margin-right:4px"></i>Total façades</span>
        <span style="font-weight:700;font-size:13px;color:var(--purple)">${f.facadeLines.reduce((s,fl)=>s+(parseInt(fl.qty)||0),0)} pcs — ${f.facadeLines.reduce((s,fl)=>{const pt=parseFloat(fl.prixTarif)||0;const rm=parseFloat(fl.remise)||0;return s+pt*(1-rm/100)*(parseInt(fl.qty)||0);},0).toFixed(3)} TND</span>
      </div>`:""}

  <!-- Actions -->
  <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap" class="no-print">

    <button class="btn btn-sm" onclick="genPdfAtelier()"><i class="ti ti-printer"></i>Bon atelier</button>
    <button class="btn btn-sm btn-teal" onclick="genPdfClient()"><i class="ti ti-file-invoice"></i>Confirmation client</button>

// ═══════════════════════════════════════════
// ─── COMMANDES (dispatcher) ───
// ═══════════════════════════════════════════
function renderOrders(){
  const subNav=`<div style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px">
    ${[{k:"articles",label:"Articles commandés",ico:"ti-article"},{k:"clients",label:"Commandes clients",ico:"ti-building-store"}].map(t=>`
    <button onclick="setTab('orders','${t.k}')" style="display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid ${S.subTab===t.k?"#17171A":"var(--border)"};background:${S.subTab===t.k?"#17171A":"transparent"};color:${S.subTab===t.k?"#FFF":"var(--text2)"};font-size:13px;font-weight:500;cursor:pointer">
      <i class="ti ${t.ico}"></i>${t.label}
    </button>`).join("")}
  </div>`;
  return subNav+(S.subTab==="articles"?renderArticles():renderClients());
}

function renderArticles(){
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const allLines=[];
  S.orders.filter(o=>o.status!=="ANNULÉ").forEach(o=>{
    toA(o.lines).filter(l=>l&&l.ref&&l.qty).forEach((l,i)=>{
      allLines.push({...l,ofId:o.id,client:o.client,deadline:o.deadline,status:o.status,rep:o.rep||"",lineKey:`${o.id}_${i}`});
    });
    toA(o.facadeLines).filter(l=>l&&l.ref&&l.qty>0).forEach((l,i)=>{
      allLines.push({...l,ofId:o.id,client:o.client,deadline:o.deadline,status:o.status,rep:o.rep||"",lineKey:`${o.id}_fac_${i}`});
    });
  });
  if(!allLines.length)return`<div class="card"><div class="empty"><i class="ti ti-inbox"></i><p>Aucun article commandé.</p></div></div>`;

  const grouped=S.articlesGrouped;
  const sel=S.selectedArticles;
  const totalPoigneesAll=allLines.filter(l=>!isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const totalFacadesAll=allLines.filter(l=>isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);

  const selCount=sel.size;
  const selBar=selCount>0?`
  <div style="position:sticky;top:52px;z-index:40;background:#17171A;color:#FFF;border-radius:var(--r);padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.2)">
    <span style="font-weight:600;font-size:13px">${selCount} article${selCount>1?"s":""} sélectionné${selCount>1?"s":""}</span>
    <span style="flex:1"></span>
    <button class="btn btn-teal btn-sm" onclick="lancerOFSelection()"><i class="ti ti-rocket"></i>Lancer en OF</button>
    <button class="btn btn-sm" style="color:#FFF;border-color:#555" onclick="S.selectedArticles=new Set();render()"><i class="ti ti-x"></i>Désélectionner</button>
  </div>`:"";

  let h=selBar+`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <span style="font-size:12px;color:var(--text2)">${allLines.length} ligne${allLines.length>1?"s":""} — ${selCount>0?`<strong>${selCount} sélectionnée${selCount>1?"s":""}</strong>`:"aucune sélection"}</span>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500">
      <span style="color:var(--text2)">Détail</span>
      <div onclick="S.articlesGrouped=!S.articlesGrouped;S.selectedArticles=new Set();render()" style="width:40px;height:22px;border-radius:11px;background:${grouped?"#17171A":"var(--border2)"};position:relative;cursor:pointer;transition:background .2s;flex-shrink:0">
        <div style="width:18px;height:18px;border-radius:50%;background:#FFF;position:absolute;top:2px;left:${grouped?"20px":"2px"};transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>
      </div>
      <span style="color:${grouped?"var(--text)":"var(--text2)"}">Regroupé</span>
    </label>
  </div>`;

  const footer=`<tfoot>
    <tr style="background:var(--surface2);border-top:2px solid var(--border2)">
      <td colspan="5" style="font-weight:600;font-size:12px;padding:8px 12px;color:var(--text2)"><i class="ti ti-hand-grab" style="margin-right:4px"></i>Total poignées</td>
      <td style="text-align:right;font-weight:700;font-size:14px;padding:8px 12px;color:var(--teal)">${totalPoigneesAll.toLocaleString("fr-FR")} pcs</td>
    </tr>
    <tr style="background:var(--surface2)">
      <td colspan="5" style="font-weight:600;font-size:12px;padding:8px 12px;color:var(--text2)"><i class="ti ti-layout-columns" style="margin-right:4px"></i>Total façades</td>
      <td style="text-align:right;font-weight:700;font-size:14px;padding:8px 12px;color:var(--purple)">${totalFacadesAll.toLocaleString("fr-FR")} pcs</td>
    </tr>
  </tfoot>`;

  if(!grouped){
    const allChecked=allLines.length>0&&allLines.every(l=>sel.has(l.lineKey));
    h+=`<div class="card" style="padding:0;overflow:hidden"><div class="table-scroll"><table style="min-width:640px"><thead><tr>
      <th style="width:36px;text-align:center"><input type="checkbox" ${allChecked?"checked":""} onchange="toggleAllArticles(this,${JSON.stringify(allLines.map(l=>l.lineKey))})" style="cursor:pointer"></th>
      <th>Désignation</th><th>Dim.</th><th class="hide-mobile">Couleur</th>
      <th style="text-align:right">Qté</th><th style="text-align:right">Nb pièces</th><th>Statut</th>
    </tr></thead><tbody>
      ${allLines.map(l=>{
        const isFac=isFacadeRef(l.ref);
        const nb=nbPcsFromLine(l);
        let dimRaw=l.dim||"";
        if(!dimRaw&&!isFac&&l.designation){const m=l.designation.match(/(\d+)\s*cm/i);if(m)dimRaw=m[1];}
        const dim=isFac?(l.largeur&&l.dim?`${l.largeur}×${l.dim}`:l.largeur||l.dim||"—"):(dimRaw?`${dimRaw} cm`:"—");
        const finalColor=l.color==="Personnalisée"?(l.colorCustom||"Perso"):l.color;
        const checked=sel.has(l.lineKey);
        return`<tr style="background:${checked?"#EBF4FF":""}">
          <td style="text-align:center"><input type="checkbox" ${checked?"checked":""} onchange="toggleArticle('${l.lineKey}')" style="cursor:pointer"></td>
          <td style="font-weight:500">${esc(l.designation||l.ref)}</td>
          <td style="font-size:12px;color:var(--text2)">${dim}</td>
          <td class="hide-mobile" style="font-size:12px;color:var(--text2)">${esc(finalColor||"—")}</td>
          <td style="text-align:right;font-size:12px">${l.qty} ${isFac?"pcs":"pqts"}</td>
          <td style="text-align:right;font-weight:700;color:${isFac?"var(--purple)":"var(--teal)"};">${nb.toLocaleString("fr-FR")}</td>
          <td>${statusPill(l.status)}</td>
        </tr>`;
      }).join("")}
    </tbody>${footer}</table></div></div>`;
  } else {
    const groups={};
    allLines.forEach(l=>{
      const key=l.designation||l.ref;
      const isFac=isFacadeRef(l.ref);
      const nb=nbPcsFromLine(l);
      if(!groups[key])groups[key]={key,designation:l.designation||l.ref,ref:l.ref,dim:l.dim,largeur:l.largeur,color:l.color,colorCustom:l.colorCustom,totalQty:0,totalPcs:0,ofs:[],statuses:[],isFacade:isFac,lineKeys:[]};
      groups[key].totalQty+=parseFloat(l.qty)||0;
      groups[key].totalPcs+=nb;
      if(!groups[key].ofs.includes(l.ofId))groups[key].ofs.push(l.ofId);
      if(!groups[key].statuses.includes(l.status))groups[key].statuses.push(l.status);
      groups[key].lineKeys.push(l.lineKey);
    });
    const gArr=Object.values(groups).sort((a,b)=>b.totalPcs-a.totalPcs);
    const allChecked=gArr.length>0&&gArr.every(g=>sel.has(g.key));
    h+=`<div class="card" style="padding:0;overflow:hidden"><div class="table-scroll"><table style="min-width:580px"><thead><tr>
      <th style="width:36px;text-align:center"><input type="checkbox" ${allChecked?"checked":""} onchange="toggleAllArticles(this,${JSON.stringify(gArr.map(g=>g.key))})" style="cursor:pointer"></th>
      <th>Désignation</th><th class="hide-mobile">Dim.</th><th class="hide-mobile">Couleur</th>
      <th style="text-align:right">Qté totale</th><th style="text-align:right">Nb pièces</th><th>Statuts</th>
    </tr></thead><tbody>
      ${gArr.map(g=>{
        const dim=g.isFacade?(g.largeur&&g.dim?`${g.largeur}×${g.dim}`:g.largeur||g.dim||"—"):(g.dim?`${g.dim} cm`:"—");
        const finalColor=g.color==="Personnalisée"?(g.colorCustom||"Perso"):g.color;
        const checked=sel.has(g.key);
        return`<tr style="background:${checked?"#EBF4FF":""}">
          <td style="text-align:center"><input type="checkbox" ${checked?"checked":""} onchange="toggleArticle('${g.key}')" style="cursor:pointer"></td>
          <td style="font-weight:600">${esc(g.designation)}</td>
          <td class="hide-mobile" style="font-size:12px;color:var(--text2)">${dim}</td>
          <td class="hide-mobile" style="font-size:12px;color:var(--text2)">${esc(finalColor||"—")}</td>
          <td style="text-align:right;font-size:12px">${g.totalQty} ${g.isFacade?"pcs":"pqts"}</td>
          <td style="text-align:right;font-weight:700;color:${g.isFacade?"var(--purple)":"var(--teal)"};">${g.totalPcs.toLocaleString("fr-FR")}</td>
          <td>${g.statuses.map(s=>statusPill(s)).join(" ")}</td>
        </tr>`;
      }).join("")}
    </tbody>${footer}</table></div></div>`;
  }
  return h;
}

function toggleArticle(key){
  if(S.selectedArticles.has(key))S.selectedArticles.delete(key);
  else S.selectedArticles.add(key);
  render();
}
function toggleAllArticles(cb,keys){
  if(cb.checked)keys.forEach(k=>S.selectedArticles.add(k));
  else keys.forEach(k=>S.selectedArticles.delete(k));
  render();
}
function lancerOFSelection(){
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const allLines=[];
  S.orders.filter(o=>o.status!=="ANNULÉ").forEach(o=>{
    toA(o.lines).filter(l=>l&&l.ref&&l.qty).forEach((l,i)=>{
      allLines.push({...l,ofId:o.id,client:o.client,deadline:o.deadline,status:o.status,lineKey:`${o.id}_${i}`});
    });
  });
  const selKeys=S.selectedArticles;
  const selLines=allLines.filter(l=>selKeys.has(l.lineKey)||selKeys.has(l.designation||l.ref));
  if(!selLines.length){alert("Aucun article sélectionné.");return;}
  const groups={};
  selLines.forEach(l=>{
    const ref=l.ref;
    if(!groups[ref])groups[ref]={ref,lines:[],totalPcs:0};
    groups[ref].lines.push(l);
    groups[ref].totalPcs+=nbPcsFromLine(l);
  });
  const choices={};
  Object.keys(groups).forEach(ref=>{if(GAMMES[ref])choices[ref]="Automatique";});
  S.ofLaunchGroups=groups;
  S.ofGammeChoices=choices;
  S.ofLaunchMode=true;
  setTab("launch");
}

function renderClients(){
  const flt=S.filter;
  const all=S.orders;
  const filtered=flt==="TOUS"?all:all.filter(o=>o.status===flt);
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let h=`<div class="filter-bar">
    ${["TOUS",...Object.keys(STATUSES)].map(s=>{
      const cnt=s==="TOUS"?all.length:all.filter(o=>o.status===s).length;
      return`<button class="fb${s===flt?" active":""}" onclick="S.filter='${s}';render()">${s==="TOUS"?"Toutes":STATUSES[s].label} (${cnt})</button>`;
    }).join("")}
  </div>`;
  if(!sorted.length)return h+`<div class="card"><div class="empty"><i class="ti ti-inbox"></i><p>Aucune commande ici.</p></div></div>`;

  h+=sorted.map(o=>{
    const isOpen=S.expandedOrder===o.id;
    const isLate=!!lateOrders().find(l=>l.id===o.id);
    const activeLines=(o.lines||[]).filter(l=>l.ref&&l.qty);
    const totalP=activeLines.filter(l=>!isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
    const totalF=activeLines.filter(l=>isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
    const totalHT=activeLines.reduce((s,l)=>{
      const nb=nbPcsFromLine(l);
      const pt=parseFloat(l.prixTarif)||0;
      const rm=parseFloat(l.remise)||0;
      return s+pt*(1-rm/100)*nb;
    },0);

    return`<div class="of-card" style="margin-bottom:8px;${isLate?"border-color:#F09595":""}">
      <div class="of-card-header" onclick="S.expandedOrder=S.expandedOrder==='${o.id}'?null:'${o.id}';render()" style="padding:12px 14px">
        <div style="display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap">
          <span style="font-weight:700;font-size:13px;color:var(--text2);min-width:70px">${o.id}</span>
          <span style="flex:1;font-size:13px;font-weight:600">${esc(o.client)}</span>
          <span class="hide-mobile" style="font-size:12px;color:var(--text2)">${esc(o.rep||"—")}</span>
          ${dlLabel(daysLeft(o.deadline))}
          ${statusPill(o.status)}
          <span class="hide-mobile" style="font-size:11px;color:var(--text3)">${activeLines.length} art.</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <button onclick="event.stopPropagation();genPdfOrder('${o.id}')" title="Confirmation client" style="background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:var(--r)" onmouseover="this.style.color='var(--teal)'" onmouseout="this.style.color='var(--text2)'">
            <i class="ti ti-file-invoice" style="font-size:18px"></i>
          </button>
          <select class="st-sel" data-oid="${o.id}" onclick="event.stopPropagation()" style="font-size:11px;padding:3px 5px;width:auto">${statusOpts(o.status)}</select>
          <i class="ti ti-chevron-${isOpen?"up":"down"}" style="color:var(--text3);font-size:16px"></i>
        </div>
      </div>
      ${isOpen?`<div style="padding:0 14px 14px;border-top:1px solid var(--border);background:var(--surface2)">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:12px 0;font-size:12px;margin-bottom:10px">
          <div><span style="color:var(--text2)">N° Cde :</span> <strong>${o.id}</strong></div>
          <div><span style="color:var(--text2)">Client :</span> <strong>${esc(o.client)}</strong></div>
          <div><span style="color:var(--text2)">Délai :</span> <strong>${esc(o.deadline||"—")}</strong></div>
          <div><span style="color:var(--text2)">Représentant :</span> <strong>${esc(o.rep||"—")}</strong></div>
          <div><span style="color:var(--text2)">Paiement :</span> <strong>${esc(o.paymentTerms||"—")}</strong></div>
          ${o.source==="WEB_CLIENT"?`<div><span style="background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600">Commande web</span></div>`:""}
        </div>
        <div class="table-scroll">
        <table style="min-width:480px;font-size:12px;background:var(--surface);border-radius:var(--r);overflow:hidden">
          <thead><tr>
            <th>Désignation</th><th class="hide-mobile">Dim.</th><th class="hide-mobile">Couleur</th>
            <th style="text-align:right">Qté</th><th style="text-align:right">Nb pcs</th>
            <th style="text-align:right">P.Tarif</th><th style="text-align:center">Remise</th>
            <th style="text-align:right">P.U. Net</th><th style="text-align:right">Total HT</th>
          </tr></thead>
          <tbody>
          ${activeLines.map(l=>{
            const isFacade=l.ref.startsWith("F-");
            let dimRaw=l.dim||"";
            if(!dimRaw&&!isFacade&&l.designation){const m=l.designation.match(/(\d+)\s*cm/i);if(m)dimRaw=m[1];}

            const pt=parseFloat(l.prixTarif)||0;
            const rm=parseFloat(l.remise)||0;
            const puNet=pt*(1-rm/100);
            const tot=puNet*nb;
            return`<tr>
              <td style="font-weight:500">${esc(l.designation||l.ref)}</td>
              <td class="hide-mobile" style="color:var(--text2)">${dim}</td>
              <td class="hide-mobile" style="color:var(--text2)">${esc(l.color==="Personnalisée"?(l.colorCustom||"Perso"):l.color||"—")}</td>
              <td style="text-align:right">${l.qty} ${isFacade?"pcs":"pqts"}</td>
              <td style="text-align:right;font-weight:700;color:${isFacade?"var(--purple)":"var(--teal)"}">${nb.toLocaleString("fr-FR")}</td>
              <td style="text-align:right;color:var(--text2)">${pt>0?pt.toFixed(3):"—"}</td>
              <td style="text-align:center;font-weight:600;color:var(--teal)">${rm>0?rm+"%":"—"}</td>
              <td style="text-align:right;color:var(--text2)">${puNet>0?puNet.toFixed(3):"—"}</td>
              <td style="text-align:right;font-weight:700">${tot>0?tot.toFixed(3):"—"}</td>
            </tr>`;
          }).join("")}
          </tbody>
          <tfoot>
            ${totalP>0?`<tr style="background:var(--surface2)"><td colspan="4" style="padding:7px 10px;font-weight:600;font-size:12px">Total poignées</td><td style="text-align:right;font-weight:700;color:var(--teal);padding:7px 10px">${totalP.toLocaleString("fr-FR")} pcs</td><td colspan="4" style="text-align:right;font-weight:700;padding:7px 10px">${activeLines.filter(l=>l.ref.startsWith("P-")).reduce((s,l)=>{const nb=(parseFloat(l.nbPcs||0)||(parseFloat(l.qty)||0)*25);const pt=parseFloat(l.prixTarif)||0;const rm=parseFloat(l.remise)||0;return s+pt*(1-rm/100)*nb;},0).toFixed(3)} TND</td></tr>`:""}
            ${totalF>0?`<tr style="background:var(--surface2)"><td colspan="4" style="padding:7px 10px;font-weight:600;font-size:12px">Total façades</td><td style="text-align:right;font-weight:700;color:var(--purple);padding:7px 10px">${totalF.toLocaleString("fr-FR")} pcs</td><td colspan="4" style="text-align:right;font-weight:700;padding:7px 10px">${activeLines.filter(l=>l.ref.startsWith("F-")).reduce((s,l)=>{const nb=parseFloat(l.qty)||0;const pt=parseFloat(l.prixTarif)||0;const rm=parseFloat(l.remise)||0;return s+pt*(1-rm/100)*nb;},0).toFixed(3)} TND</td></tr>`:""}
            <tr style="background:#17171A;color:#FFF"><td colspan="5" style="padding:8px 10px;font-weight:700">TOTAL GÉNÉRAL HT</td><td colspan="4" style="text-align:right;font-weight:700;font-size:14px;padding:8px 10px">${totalHT>0?totalHT.toFixed(3)+" TND":"—"}</td></tr>
          </tfoot>
        </table></div>
      </div>`:""}
    </div>`;
  }).join("");
  return h;
}

function genPdfOrder(oid){

  const bonusInfo=getRemisePoignee(totalP,o.client);

function renderLaunch(){
  if(S.ofLaunchMode)return renderOFPanel();
  if(S.standardsForm)return renderStandardsForm();
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);

  // Build groups by ref from EN_ATTENTE orders
  const groups={};
  S.orders.filter(o=>o.status==="EN_ATTENTE").forEach(o=>{
    toA(o.lines).filter(l=>l&&l.ref&&l.qty).forEach(l=>{
      const ref=l.ref;
      if(!groups[ref])groups[ref]={ref,orders:[],totalPcs:0,breakdown:{}};
      const nb=nbPcsFromLine(l);
      let oEntry=groups[ref].orders.find(x=>x.ofId===o.id);
      if(!oEntry){oEntry={ofId:o.id,client:o.client,deadline:o.deadline,date:o.date,lines:[],totalPcs:0};groups[ref].orders.push(oEntry);}
      oEntry.lines.push(l);oEntry.totalPcs+=nb;groups[ref].totalPcs+=nb;
      const dim=l.dim?(isFacadeRef(ref)?l.dim+"mm":l.dim+"cm"):"";
      const color=l.color==="Personnalisée"?(l.colorCustom||"Perso"):l.color||"";
      const bkey=[dim,color].filter(Boolean).join(" ");
      groups[ref].breakdown[bkey]=(groups[ref].breakdown[bkey]||0)+nb;
    });
  });
  const gArr=Object.values(groups).sort((a,b)=>b.totalPcs-a.totalPcs);
  if(!S.ofSelByRef)S.ofSelByRef={};
  gArr.forEach(g=>{if(!S.ofSelByRef[g.ref])S.ofSelByRef[g.ref]=new Set(g.orders.map(o=>o.ofId));});

  const OF_STATUS={"LANCÉ":{label:"Lancé",pill:"st-launched"},"EN_COURS":{label:"En cours",pill:"st-run"},"TERMINÉ":{label:"Terminé",pill:"st-done"},"ANNULÉ":{label:"Annulé",pill:"st-cancel"}};
  const sorted=[...S.ofs].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!gArr.length&&!sorted.length)return`<div class="card"><div class="empty"><i class="ti ti-rocket"></i><p>Aucune commande en attente de lancement.</p></div></div>`;

  let h="";

  // ── À LANCER ──
  if(gArr.length){
    h+=`<div style="font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">À lancer</div>`;
    h+=gArr.map(g=>{
      const sel=S.ofSelByRef[g.ref]||new Set();
      const allSelected=g.orders.length>0&&g.orders.every(o=>sel.has(o.ofId));
      const selPcs=g.orders.filter(o=>sel.has(o.ofId)).reduce((s,o)=>s+o.totalPcs,0);
      const hasGamme=GAMMES&&GAMMES[g.ref];
      const gamme=(S.ofGammeChoices&&S.ofGammeChoices[g.ref])||Object.keys((GAMMES&&GAMMES[g.ref])||{})[0]||"";
      const isOpen=S.openLaunchRef===g.ref;
      return`<div class="of-card" style="margin-bottom:12px">
        <div style="padding:14px 16px;border-bottom:${isOpen?"1":"0"}px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer" onclick="S.openLaunchRef=S.openLaunchRef==='${g.ref}'?null:'${g.ref}';render()">
          <span style="font-weight:700;font-size:16px">${g.ref}</span>
          <span style="background:var(--teal-bg);color:var(--teal);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${g.totalPcs.toLocaleString("fr-FR")} pcs</span>
          <span style="font-size:12px;color:var(--text2)">${g.orders.length} commande${g.orders.length>1?"s":""}</span>
          <span style="flex:1"></span>
          ${sel.size>0?`<span style="background:#17171A;color:#FFF;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600">${sel.size} sélectionnée${sel.size>1?"s":""}</span>`:""}
          <i class="ti ti-chevron-${isOpen?"up":"down"}" style="color:var(--text3);font-size:16px"></i>
        </div>
        ${isOpen?`<div style="padding:14px 16px">
          <div style="margin-bottom:14px">
            <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Répartition par dimension / couleur</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${Object.entries(g.breakdown).map(([k,v])=>`<span style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:4px 10px;font-size:12px"><strong>${v.toLocaleString("fr-FR")} pcs</strong>${k?" — "+k:""}</span>`).join("")}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
            <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px">Commandes à inclure</div>
            <button onclick="toggleAllOFRef('${g.ref}')" style="padding:3px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;color:var(--text2)">
              ${allSelected?"Tout désélectionner":"Tout sélectionner"}
            </button>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
            ${g.orders.map(o=>{
              const checked=sel.has(o.ofId);
              const late=lateOrders().find(l=>l.id===o.ofId);
              return`<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1px solid ${checked?"var(--teal)":"var(--border)"};background:${checked?"var(--teal-bg)":"var(--surface)"};cursor:pointer">
                <input type="checkbox" ${checked?"checked":""} onclick="event.stopPropagation();toggleOFOrder('${g.ref}','${o.ofId}')" style="width:16px;height:16px;cursor:pointer;flex-shrink:0">
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span style="font-weight:700;font-size:13px">${o.ofId}</span>
                    <span style="font-size:13px">${esc(o.client)}</span>
                    ${dlLabel(daysLeft(o.deadline))}
                    ${late?`<span style="background:var(--red-bg);color:var(--red);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">En retard</span>`:""}
                  </div>
                  <div style="font-size:11px;color:var(--text2);margin-top:3px">
                    ${o.lines.map(l=>{const nb=nbPcsFromLine(l);const dim=l.dim?(isFacadeRef(g.ref)?l.dim+"mm":l.dim+"cm"):"";const col=l.color==="Personnalisée"?(l.colorCustom||"Perso"):l.color||"";return nb.toLocaleString("fr-FR")+" pcs"+(dim?" — "+dim:"")+(col?" "+col:"");}).join(" &nbsp;|&nbsp; ")}
                  </div>

                <span style="font-weight:700;font-size:13px;color:var(--teal);flex-shrink:0">${o.totalPcs.toLocaleString("fr-FR")} pcs</span>

            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${Object.keys(GAMMES[g.ref]).map(gm=>`<button onclick="if(!S.ofGammeChoices)S.ofGammeChoices={};S.ofGammeChoices['${g.ref}']='${gm}';render()" style="padding:8px 16px;border-radius:var(--r);border:2px solid ${gamme===gm?"#17171A":"var(--border)"};background:${gamme===gm?"#17171A":"var(--surface)"};color:${gamme===gm?"#FFF":"var(--text)"};font-size:13px;font-weight:600;cursor:pointer">${gm}</button>`).join("")}

          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">

            </div>
            <button onclick="lancerOFRef('${g.ref}')" ${sel.size===0?"disabled":""} style="display:flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--r);border:none;background:${sel.size>0?"#17171A":"#888"};color:#FFF;font-size:13px;font-weight:700;cursor:${sel.size>0?"pointer":"not-allowed"}">
              <i class="ti ti-rocket"></i>Lancer l'OF
            </button>
          </div>
        </div>`:""}
      </div>`;
    }).join("");
  }

  // ── OFs CRÉÉS ──
  if(sorted.length){
    h+=`<div style="font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 12px">OFs créés</div>`;
    h+=sorted.map(pf=>{
      const isOpen=S.openOf===pf.id;
      return`<div class="of-card" style="margin-bottom:8px">

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
              <span style="font-weight:700;font-size:14px">${g.ref}</span>
              ${g.gamme?`<span style="background:var(--purple-bg);color:var(--purple);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600">${g.gamme}</span>`:""}

function toggleOFOrder(ref,ofId){

  if(S.ofSelByRef[ref].has(ofId))S.ofSelByRef[ref].delete(ofId);
  else S.ofSelByRef[ref].add(ofId);
  render();
}
function toggleAllOFRef(ref){
  const allIds=S.orders.filter(o=>o.status==="EN_ATTENTE").filter(o=>{
    const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
    return toA(o.lines).some(l=>l&&l.ref===ref&&l.qty);
  }).map(o=>o.id);
  if(!S.ofSelByRef)S.ofSelByRef={};
  const sel=S.ofSelByRef[ref]||new Set();
  const allSelected=allIds.length>0&&allIds.every(id=>sel.has(id));
  S.ofSelByRef[ref]=allSelected?new Set():new Set(allIds);
  render();
}
function lancerOFRef(ref){
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const sel=S.ofSelByRef&&S.ofSelByRef[ref]?S.ofSelByRef[ref]:new Set();
  if(!sel.size){alert("Aucune commande sélectionnée.");return;}
  const selOrders=S.orders.filter(o=>sel.has(o.id));
  const lines=[];
  selOrders.forEach(o=>toA(o.lines).filter(l=>l&&l.ref===ref&&l.qty).forEach(l=>lines.push({...l,ofId:o.id,client:o.client})));
  const totalPcs=lines.reduce((s,l)=>s+nbPcsFromLine(l),0);
  const gamme=(S.ofGammeChoices&&S.ofGammeChoices[ref])||"";
  const postes=GAMMES&&GAMMES[ref]&&gamme?GAMMES[ref][gamme]:[];
  const pfNum=S.ofs.length+1;
  const pfId="PF-"+String(pfNum).padStart(3,"0");
  const pf={id:pfId,ref,date:todayStr(),createdAt:new Date().toISOString(),status:"LANCÉ",
    groups:[{ref,gamme,postes:postes||[],lines,totalPcs}],orderIds:[...sel]};
  S.ofs=[...S.ofs,pf];
  if(db)db.ref("ofs/"+pfId).set(pf);
  S.orders=S.orders.map(o=>sel.has(o.id)?{...o,status:"LANCÉ"}:o);
  saveOrders();
  if(S.ofSelByRef)delete S.ofSelByRef[ref];
  // Open standards form
  S.standardsForm={pfId,ref,postes:postes||[],totalPcs,gamme};
  S.openLaunchRef=null;
  render();
}

function saveStandards(propose){
  const{pfId,ref,totalPcs}=S.standardsForm;
  const postes=S.standardsForm.postes||[];
  if(!postes.length){alert("Veuillez sélectionner une gamme et saisir les temps.");return;}
  const stdData={};
  postes.forEach((poste,i)=>{

    if(v>0)stdData[poste]=v;
  });
  S.standards[ref]=stdData;
  if(db)db.ref("standards/"+ref).set(stdData);

  if(propose){
    try{
      const startDateEl=document.getElementById("std-start-date");
      const hpjEl=document.getElementById("std-hpj");
      const startDate=startDateEl?startDateEl.value:todayStr();
      const hpj=hpjEl?parseFloat(hpjEl.value)||8:8;
      if(!startDate){alert("Veuillez choisir une date de début.");return;}
      proposePlanning(pfId,ref,postes,stdData,totalPcs,startDate,hpj);
    }catch(err){
      console.error("proposePlanning error:",err);
      alert("Erreur planning : "+String(err)+"\n\nLes temps ont été enregistrés. Vous pouvez planifier manuellement.");
      S.standardsForm=null;render();

function proposePlanning(pfId,ref,postes,stdData,totalPcs,startDate,hpj){
  if(!S.plan||typeof S.plan!=="object")S.plan={};
  // Map gamme poste names to WS ids
  const POSTE_MAP={
    "Découpe presse":"press60","Reprise Presse":"press60",
    "Ébavurage":"ebav1","Ébavurage 1":"ebav1","Ébavurage 2":"ebav2",
    "Coupe":"coupe_auto","Coupe auto":"coupe_auto","Coupe automatique":"coupe_auto",
    "Coupe semi-auto":"coupe_semi","Coupe 45°":"coupe45",
    "Perçage":"perc_tar","Perçage/Taraudage":"perc_tar","Taraudage":"perc_tar",
    "Peinture":"peinture","Ligne peinture":"peinture",
    "CNC 3m":"cnc3m","CNC 1,5m":"cnc15m","CNC":"cnc3m",
    "Assemblage façades":"asm_fac","Assemblage miroir":"asm_mir",
    "Emballage":"press60", // default to press60 for packaging
    "Injection":"inj125a",
  };

  const slots=[];
  let currentDate=new Date(startDate+"T00:00:00");
  const hpjN=parseFloat(hpj)||8;
  const minPerDay=hpjN*60;

  postes.forEach(poste=>{
    const tUnit=parseFloat(stdData[poste])||0;
    const wsId=POSTE_MAP[poste]||null;
    if(!tUnit||!wsId){
      slots.push({poste,wsId:null,start:null,note:!tUnit?"Temps non saisi":"Poste non trouvé"});
      return;
    }
    const totalMin=tUnit*totalPcs;
    const nbDays=Math.max(1,Math.ceil(totalMin/minPerDay));
    const startStr=currentDate.toISOString().split("T")[0];

    // Add one planning entry per occupied day
    let d=new Date(currentDate);
    let daysAdded=0;
    while(daysAdded<nbDays){
      const dow=d.getDay();
      if(dow!==0&&dow!==6){
        const ds=d.toISOString().split("T")[0];
        const key=wsId+"_"+ds;
        const hoursThisDay=Math.min(hpjN,(totalMin-daysAdded*minPerDay)/60);
        if(!S.plan[key]||S.plan[key].proposed){
          S.plan[key]={ofId:pfId,hours:Math.round(hoursThisDay*10)/10,notes:ref+" (proposition)",proposed:true};
        }
        daysAdded++;
      }
      d.setDate(d.getDate()+1);
    }
    const endStr=d.toISOString().split("T")[0];
    slots.push({poste,wsId,start:startStr,end:endStr,totalMin:Math.round(totalMin),nbDays,tUnit});
    // Next poste starts after this one
    currentDate=new Date(d);
    while(currentDate.getDay()===0||currentDate.getDay()===6){
      currentDate.setDate(currentDate.getDate()+1);
    }
  });

  // Save plan to Firebase
  if(db)db.ref("plan").set(S.plan);

  // Save proposal to OF
  const pfIdx=S.ofs.findIndex(o=>o.id===pfId);
  if(pfIdx>=0)S.ofs[pfIdx]={...S.ofs[pfIdx],planningProposal:slots};
  if(db)db.ref("ofs/"+pfId+"/planningProposal").set(slots);

  S.standardsForm=null;
  // Navigate to planning at the right week
  if(slots[0]&&slots[0].start){
    const startD=new Date(slots[0].start+"T00:00:00");
    const today=new Date();today.setHours(0,0,0,0);
    const diffDays=Math.round((startD-today)/86400000);
    S.weekOff=Math.floor(diffDays/7);
  }
  setTab("planning");
}

function getWeekKey(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=d.getDay();
  const diff=d.getDate()-(day===0?-6:1-day);// Monday
  const mon=new Date(d.setDate(diff));
  return mon.toISOString().split("T")[0];
}

      <td class="ws-col" style="position:sticky;left:0;z-index:1">${ws.name}</td>
      ${wd.map(d=>{
        const ds=isoDate(d);const key=ws.id+"_"+ds;
        const cell=S.plan[key];const isT=ds===today;const isSel=sel&&sel.key===key;
        return`<td class="pcell${isSel?" sel":""}${isT?" today-c":""}${cell&&cell.proposed?" proposed":""}" onclick="planClick('${ws.id}','${ds}','${key}','${esc(fmtLong(d))}')">
          ${cell?`<div class="cell-of" style="font-size:10px;${cell.proposed?"color:var(--teal);font-style:italic":""}">${cell.ofId}</div>${cell.hours?`<div class="cell-h">${cell.hours}h</div>`:""}${cell.notes?`<div class="cell-note">${esc(cell.notes)}</div>`:""}`:""}
        </td>`;
      }).join("")}
    </tr>`).join("")}
  </tbody></table></div>
  <p style="font-size:11px;color:var(--text3);margin-top:8px">Cliquez sur une case pour affecter ou modifier un OF. <em>Italique vert = proposition automatique.</em></p>
  <p style="font-size:10px;color:var(--text3)">Plan entries cette semaine : ${Object.keys(S.plan||{}).filter(k=>wd.some(d=>k.endsWith(isoDate(d)))).length}</p>`;
  return h;
}
