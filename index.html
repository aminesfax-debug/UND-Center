function renderApurement(){
  const eligible=S.orders.filter(o=>["LANCÉ","EN_COURS","TERMINÉ"].includes(o.status));
  if(!eligible.length)return`<div class="card"><div class="empty"><i class="ti ti-checkup-list"></i><p>Aucune commande éligible à l'apurement.<br>Lancez d'abord des ordres de fabrication.</p></div></div>`;
  let h=`<p style="font-size:12px;color:var(--text2);margin-bottom:12px">L'apurement clôture un OF, confirme les quantités produites, valorise le stock et génère un bon d'entrée magasin.</p>`;
  h+=eligible.map(o=>{
    const isOpen=S.openApur===o.id;
    const activeLines=(o.lines||[]).filter(l=>l.ref);
    return`<div class="apur-card">
      <div class="apur-header" onclick="S.openApur=S.openApur==='${o.id}'?null:'${o.id}';render()">
        <div style="display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap">
          <span style="font-weight:700;font-size:14px">${o.id}</span>
          <span style="flex:1;font-size:13px">${esc(o.client)}</span>
          ${dlLabel(daysLeft(o.deadline))} ${statusPill(o.status)}
        </div>
        <i class="ti ti-chevron-${isOpen?"up":"down"}" style="color:var(--text3);font-size:16px;flex-shrink:0"></i>
      </div>
      ${isOpen?renderApurBody(o,activeLines):""}
    </div>`;
  }).join("");
  return h;
}

function renderApurBody(o,lines){
  const apData=o.apurData||{};
  const currency=o.currency||"TND";
  let totalVal=0;
  lines.forEach(l=>{
    const qProd=parseFloat((apData[l.id]||{}).qtyProd||l.qty)||0;
    const pRef=parseFloat((apData[l.id]||{}).prixRef||l.unitPrice)||0;
    totalVal+=qProd*pRef;
  });
  return`<div class="apur-body">
    <div style="font-weight:600;font-size:12px;margin-bottom:10px">Quantités produites & valorisation</div>
    <div class="table-scroll"><table class="apur-table" style="min-width:480px"><thead><tr>
      <th>Réf</th><th>Désignation</th><th>Qté commandée</th><th>Qté produite</th><th>Prix réf. (${currency})</th><th style="text-align:right">Valeur HT</th>
    </tr></thead><tbody>
      ${lines.map(l=>{
        const ap=apData[l.id]||{};
        const qP=parseFloat(ap.qtyProd||l.qty)||0;
        const pR=parseFloat(ap.prixRef||l.unitPrice)||0;
        const val=qP*pR;
        return`<tr>
          <td style="font-weight:600">${l.ref}</td>
          <td style="font-size:12px">${esc(l.designation)||"—"}</td>
          <td style="color:var(--text2)">${l.qty} ${l.unit}</td>
          <td><input type="number" class="apur-qty" data-oid="${o.id}" data-lid="${l.id}" value="${ap.qtyProd!==undefined?ap.qtyProd:l.qty}" min="0" step="any" style="font-size:12px;width:90px"></td>
          <td><input type="number" class="apur-prix" data-oid="${o.id}" data-lid="${l.id}" value="${ap.prixRef!==undefined?ap.prixRef:l.unitPrice}" min="0" step="0.001" style="font-size:12px;width:90px"></td>
          <td style="text-align:right;font-weight:600;font-size:12px" id="apur-val-${o.id}-${l.id}">${val>0?val.toFixed(3):"—"}</td>
        </tr>`;
      }).join("")}
    </tbody><tfoot>
      <tr style="background:var(--surface2)">
        <td colspan="5" style="font-weight:700;font-size:13px;padding:8px 10px">Total valorisé (${currency})</td>
        <td style="text-align:right;font-weight:700;font-size:13px;padding:8px 10px" id="apur-total-${o.id}">${totalVal>0?totalVal.toFixed(3):"—"}</td>
      </tr>
    </tfoot></table></div>

    <div class="form-group" style="max-width:300px;margin-top:12px">
      <label>Date de production / clôture</label>
      <input type="date" id="apur-date-${o.id}" value="${apData.dateProduction||todayStr()}">
    </div>

    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-purple" onclick="apurerOF('${o.id}')"><i class="ti ti-checkup-list"></i>Apurer & Générer bon d'entrée</button>
      <button class="btn btn-sm" onclick="saveApurDraft('${o.id}')"><i class="ti ti-device-floppy"></i>Sauvegarder brouillon</button>
    </div>

    <div class="bon-preview" id="bon-preview-${o.id}" style="display:none"></div>
  </div>`;
}

// ═══════════════════════════════════════════
// ─── BONS D'ENTRÉE ───
// ═══════════════════════════════════════════
function renderBons(){
  if(!S.bons.length)return`<div class="card"><div class="empty"><i class="ti ti-package"></i><p>Aucun bon d'entrée généré.<br>Apurez des commandes pour créer des bons d'entrée magasin.</p></div></div>`;
  const sorted=[...S.bons].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let h=`<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:var(--text2)">${S.bons.length} bon${S.bons.length>1?"s":""} d'entrée — valeur totale : <strong>${S.bons.reduce((s,b)=>s+(b.totalValue||0),0).toFixed(3)} (multi-devises)</strong></span>
    <button class="btn btn-sm" onclick="window.print()"><i class="ti ti-printer"></i>Imprimer</button>
  </div>`;
  h+=sorted.map(b=>bonCard(b)).join("");
  return h;
}

function bonCard(b,preview=false){
  const style=preview?"":`margin-bottom:12px`;
  return`<div class="bon-preview" style="${style}">
    <div class="bon-title"><i class="ti ti-package"></i>Bon d'entrée magasin — ${b.id}
      ${!preview?`<button class="btn btn-xs no-print" style="margin-left:auto" onclick="deleteBon('${b.id}')"><i class="ti ti-trash"></i></button>`:""}
    </div>
    <div class="bon-meta">
      <div><span>N° OF :</span> <strong>${b.ofId}</strong></div>
      <div><span>Client :</span> <strong>${esc(b.client)}</strong></div>
      <div><span>Date production :</span> <strong>${fmtDate(b.dateProduction)}</strong></div>
      <div><span>Date bon :</span> <strong>${fmtDate(b.date)}</strong></div>
      <div><span>Devise :</span> <strong>${b.currency}</strong></div>
      <div><span>Valeur totale :</span> <strong style="color:var(--teal)">${(b.totalValue||0).toFixed(3)} ${b.currency}</strong></div>
    </div>
    <table style="font-size:12px"><thead><tr>
      <th>Réf produit</th><th>Désignation</th><th>Couleur</th><th>Qté entrée</th><th>Unité</th><th>Prix unit.</th><th style="text-align:right">Valeur HT</th>
    </tr></thead><tbody>
      ${(b.lines||[]).map(l=>`<tr>
        <td style="font-weight:600">${l.ref}</td>
        <td>${esc(l.designation)||"—"}</td>
        <td>${esc(l.color)||"—"}</td>
        <td style="font-weight:600">${l.qtyProd} ${l.unit}</td>
        <td>${l.unit}</td>
        <td>${parseFloat(l.prixRef||0).toFixed(3)}</td>
        <td style="text-align:right;font-weight:600">${((parseFloat(l.qtyProd)||0)*(parseFloat(l.prixRef)||0)).toFixed(3)}</td>
      </tr>`).join("")}
    </tbody><tfoot>
      <tr style="background:var(--surface2)">
        <td colspan="6" style="font-weight:700;padding:8px 10px">Total valorisé</td>
        <td style="text-align:right;font-weight:700;padding:8px 10px">${(b.totalValue||0).toFixed(3)} ${b.currency}</td>
      </tr>
    </tfoot></table>
  </div>`;
}

// ═══════════════════════════════════════════
// ─── ACTIONS ───
// ═══════════════════════════════════════════
function setOrderStatus(oid,status){
  S.orders=S.orders.map(o=>o.id===oid?{...o,status}:o);
  saveOrders();updateBadges();
}

function resetForm(){S.form=emptyForm();render();}

function readForm(){
  ["client","deadline","rep","paymentTerms"].forEach(id=>{
    const el=document.getElementById("f-"+id);if(el)S.form[id]=el.value;
  });
  document.querySelectorAll("[data-lid]").forEach(el=>{
    const lid=parseInt(el.dataset.lid),lf=el.dataset.lf;
    const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
    // Skip hidden dim-inp (façade text input hidden for poignées)
    if(el.classList.contains("dim-inp")&&el.style.display==="none")return;
    // Skip hidden dim-sel (poignée select hidden for façades)
    if(el.classList.contains("dim-sel")&&el.style.display==="none")return;
    // Skip disabled largeur
    if(el.classList.contains("largeur-inp")&&el.disabled)return;
    line[lf]=el.value;
  });
  S.form.lines.forEach(l=>{
    l.unit=UNIT_FIXED;
    if(!l.ref.startsWith("F-"))l.largeur="";
    l.designation=buildDesignation(l.ref,l.dim,l.largeur,l.color,l.colorCustom);
  });
}

function submitOrder(){
  readForm();
  const f=S.form;
  const poigneeLines=f.lines.filter(l=>l.ref&&l.qty).map(l=>({
    ...l,unit:UNIT_FIXED,
    designation:l.designation||buildDesignation(l.ref,l.dim,l.largeur,l.color,l.colorCustom),
    nbPcs:(parseFloat(l.qty)||0)*25,
  }));
  const facadeLinesClean=(f.facadeLines||[]).filter(fl=>fl.ref&&fl.qty>0).map(fl=>({
    ...fl,unit:"pcs",nbPcs:parseInt(fl.qty)||0,
  }));
  const lines=[...poigneeLines,...facadeLinesClean];
  if(!f.client||!f.deadline||!lines.length){
    alert("Obligatoire : client, délai, et au moins une ligne poignée ou façade.");return;
  }
  const order={
    id:nextOF(),date:todayStr(),createdAt:new Date().toISOString(),
    client:f.client,deadline:f.deadline,rep:f.rep,paymentTerms:f.paymentTerms,
    lines,status:"EN_ATTENTE",
  };
  S.orders=[...S.orders,order];
  saveOrders();
  sendSlackNotif(order,"ATELIER");
  S.form=emptyForm();
  setTab("orders","clients");
}

function launchOF(oid){
  // Collect ws assignments
  const wsAssign={};
  document.querySelectorAll(`.ws-date[data-oid="${oid}"],.ws-hours[data-oid="${oid}"]`).forEach(el=>{
    const wsid=el.dataset.wsid;
    if(!wsAssign[wsid])wsAssign[wsid]={};
    if(el.classList.contains("ws-date"))wsAssign[wsid].startDate=el.value;
    else wsAssign[wsid].hours=el.value;
  });
  // Filter empty
  const filled=Object.fromEntries(Object.entries(wsAssign).filter(([,v])=>v.startDate||v.hours));
  S.orders=S.orders.map(o=>o.id===oid?{...o,status:"LANCÉ",wsAssign:filled,launchedAt:new Date().toISOString()}:o);
  saveOrders();
  S.openOf=null;
  updateBadges();
  render();
  // Optional: sync to planning
  const o=S.orders.find(x=>x.id===oid);
  if(o)Object.entries(filled).forEach(([wsid,v])=>{
    if(v.startDate){
      const key=wsid+"_"+v.startDate;
      S.plan[key]={ofId:oid,hours:v.hours||"",notes:""};
    }
  });
  savePlan();
}

function planClick(wsId,ds,key,dayLabel){
  if(S.planSel&&S.planSel.key===key){S.planSel=null;render();return;}
  S.planSel={wsId,key,dayLabel};render();
}
function planSave(){
  if(!S.planSel)return;
  const ofId=document.getElementById("as-of")?.value;
  const hours=document.getElementById("as-h")?.value;
  const notes=document.getElementById("as-note")?.value;
  if(!ofId){planClear();return;}
  S.plan={...S.plan,[S.planSel.key]:{ofId,hours,notes}};
  savePlan();S.planSel=null;render();
}
function planClear(){
  if(!S.planSel)return;
  delete S.plan[S.planSel.key];
  savePlan();S.planSel=null;render();
}

function collectApurData(oid){
  const data={};
  document.querySelectorAll(`.apur-qty[data-oid="${oid}"],.apur-prix[data-oid="${oid}"]`).forEach(el=>{
    const lid=parseInt(el.dataset.lid);
    if(!data[lid])data[lid]={};
    if(el.classList.contains("apur-qty"))data[lid].qtyProd=el.value;
    else data[lid].prixRef=el.value;
  });
  const dateEl=document.getElementById(`apur-date-${oid}`);
  const dateProduction=dateEl?dateEl.value:todayStr();
  return{data,dateProduction};
}

function saveApurDraft(oid){
  const{data,dateProduction}=collectApurData(oid);
  S.orders=S.orders.map(o=>o.id===oid?{...o,apurData:{...data,dateProduction}}:o);
  saveOrders();
  alert("Brouillon sauvegardé.");
}

function apurerOF(oid){
  const{data,dateProduction}=collectApurData(oid);
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  const activeLines=(o.lines||[]).filter(l=>l.ref);
  const bonLines=activeLines.map(l=>{
    const ap=data[l.id]||{};
    return{...l,qtyProd:ap.qtyProd!==undefined?ap.qtyProd:l.qty,prixRef:ap.prixRef!==undefined?ap.prixRef:l.unitPrice};
  }).filter(l=>parseFloat(l.qtyProd)>0);
  if(!bonLines.length){alert("Aucune quantité produite saisie.");return;}
  const totalValue=bonLines.reduce((s,l)=>(parseFloat(l.qtyProd)||0)*(parseFloat(l.prixRef)||0)+s,0);
  const bon={
    id:nextBon(),ofId:oid,client:o.client,currency:o.currency||"TND",
    date:todayStr(),dateProduction,totalValue,lines:bonLines,
  };
  S.bons=[...S.bons,bon];
  saveBons();
  S.orders=S.orders.map(x=>x.id===oid?{...x,status:"APURÉ",apurData:{...data,dateProduction},bonId:bon.id}:x);
  saveOrders();
  S.openApur=null;
  updateBadges();
  // Show preview
  render();
  setTimeout(()=>{
    const prev=document.getElementById(`bon-preview-${oid}`);
    if(prev){prev.style.display="block";prev.innerHTML=bonCard(bon,true);}
  },100);
}

function deleteBon(id){
  if(!confirm("Supprimer ce bon d'entrée ?"))return;
  S.bons=S.bons.filter(b=>b.id!==id);
  saveBons();render();
}

// ─── LIVE TOTALS for order form ───
function attachFormListeners(){
  if(S.tab!=="new_order")return;

  function updateDesignation(lid){
    // Scope to desktop table to avoid mobile card duplicates
    const sc=document.getElementById("desk-tbody")||document;
    const refEl=sc.querySelector(`.ref-sel[data-lid="${lid}"]`);
    const dimSelEl=sc.querySelector(`.dim-sel[data-lid="${lid}"]`);
    const dimInpEl=sc.querySelector(`.dim-inp[data-lid="${lid}"]`);
    const largeurEl=sc.querySelector(`.largeur-inp[data-lid="${lid}"]`);
    const colorEl=sc.querySelector(`.color-inp[data-lid="${lid}"]`);
    const colorCustomEl=sc.querySelector(`.color-custom[data-lid="${lid}"]`);

    const ref=refEl?refEl.value:"";
    const isFacade=ref.startsWith("F-");
    const color=colorEl?colorEl.value:"";
    const colorCustom=colorCustomEl?colorCustomEl.value.trim():"";

    // Toggle dim: select for P-, text input for F-
    if(dimSelEl)dimSelEl.style.display=isFacade?"none":"block";
    if(dimInpEl){
      dimInpEl.style.display=isFacade?"block":"none";
      if(!isFacade)dimInpEl.value="";
    }
    const dim=isFacade?(dimInpEl?dimInpEl.value.trim():""):(dimSelEl?dimSelEl.value:"");

    // Show/hide custom color input
    if(colorCustomEl)colorCustomEl.style.display=color==="Personnalisée"?"block":"none";

    // Enable/disable largeur based on ref type
    if(largeurEl){
      largeurEl.disabled=!isFacade;
      largeurEl.placeholder=isFacade?"ex: 60":"—";
      largeurEl.style.background=isFacade?"":"var(--surface2)";
      largeurEl.style.color=isFacade?"":"var(--text3)";
      if(!isFacade)largeurEl.value="";
    }
    const largeur=largeurEl&&!largeurEl.disabled?largeurEl.value.trim():"";

    const desig=buildDesignation(ref,dim,largeur,color,colorCustom);
    const line=S.form.lines.find(l=>l.id===lid);
    if(line){
      line.ref=ref;line.dim=dim;line.largeur=largeur;line.color=color;line.colorCustom=colorCustom;line.designation=desig;

      // Auto-fill prix tarif from table
      const autoPrice=getPrixTarif(ref,dim);
      if(autoPrice!==""){
        line.prixTarif=autoPrice;
        const sc3=document.getElementById("desk-tbody")||document;
        const prixEl=sc3.querySelector(`.prix-input[data-lid="${lid}"]`);
        if(prixEl)prixEl.value=autoPrice;
      }
    }
    const sc4=document.getElementById("desk-tbody")||document;
    const inp=sc4.querySelector(`.desig-inp[data-lid="${lid}"]`);
    if(inp)inp.value=desig;
    updateLineTotals(lid);
  }

  function updateLineTotals(lid){
    const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
    const isFacade=line.ref&&(line.ref.startsWith("F-")||line.ref.startsWith("SKIN-"));
    const q=parseFloat(line.qty)||0;
    const nbPcs=isFacade?q:q*25;
    const pt=parseFloat(line.prixTarif)||0;
    const totalPoigneesCmd=S.form.lines.filter(l=>l.ref&&l.ref.startsWith("P-")).reduce((s,l)=>s+(parseFloat(l.qty)||0)*25,0);
    const rm=isFacade?parseFloat(line.remise)||0:getRemisePoignee(totalPoigneesCmd,S.form.client).remise;
    const puNet=pt*(1-rm/100);
    const totalHT=puNet*nbPcs;

    // Update nb-pcs, remise, pu-net, line-total-ht in this row
    const sc2=document.getElementById("desk-tbody")||document;
    const qtyEl=sc2.querySelector(`[data-lid="${lid}"][data-lf="qty"]`);
    if(qtyEl){
      const row=qtyEl.closest("tr");
      if(row){
        const nb=row.querySelector(".nb-pcs");if(nb)nb.textContent=q>0?nbPcs.toLocaleString("fr-FR"):"—";
        const remEl=row.querySelector(".remise-auto");if(remEl)remEl.textContent=rm+"%";
        const puEl=row.querySelector(".pu-net");if(puEl)puEl.textContent=pt>0?puNet.toFixed(3):"—";
        const totEl=row.querySelector(".line-total-ht");if(totEl)totEl.textContent=totalHT>0?totalHT.toFixed(3):"—";
        // Update prix tarif input if auto-filled
        const pxEl=row.querySelector(".prix-input");if(pxEl&&line.prixTarif)pxEl.value=line.prixTarif;
      }
    }

    // Refresh footer totals
    const lines=S.form.lines;
    const totalPcs=lines.filter(l=>l.ref&&l.ref.startsWith("P-")).reduce((s,l)=>s+(parseFloat(l.qty)||0)*25,0);
    const rmGlobal=getRemisePoignee(totalPcs,S.form.client).remise;
    const totalHTP=lines.filter(l=>l.ref&&l.ref.startsWith("P-")).reduce((s,l)=>{
      const n=(parseFloat(l.qty)||0)*25;const p=parseFloat(l.prixTarif)||0;
      return s+p*(1-rmGlobal/100)*n;},0);

    const e=id=>document.getElementById(id);
    if(e("total-pcs-poignees"))e("total-pcs-poignees").textContent=totalPcs>0?totalPcs.toLocaleString("fr-FR")+" pcs":"—";
    if(e("total-ht-poignees"))e("total-ht-poignees").textContent=totalHTP>0?totalHTP.toFixed(3)+" TND":"—";
    if(e("total-ht-general"))e("total-ht-general").textContent=totalHTP>0?totalHTP.toFixed(3)+" TND":"—";

    // Also refresh remise% on ALL poignee rows (global remise can change with any qty)
    const sc5=document.getElementById("desk-tbody")||document;
    lines.filter(l=>l.ref&&l.ref.startsWith("P-")&&l.id!==lid).forEach(l2=>{
      const qtyEl2=sc5.querySelector(`[data-lid="${l2.id}"][data-lf="qty"]`);
      if(qtyEl2){const row2=qtyEl2.closest("tr");if(row2){
        const pt2=parseFloat(l2.prixTarif)||0;
        const q2=parseFloat(l2.qty)||0;const nb2=q2*25;
        const puNet2=pt2*(1-rmGlobal/100);const tot2=puNet2*nb2;
        const remEl2=row2.querySelector(".remise-auto");if(remEl2)remEl2.textContent=rmGlobal+"%";
        const puEl2=row2.querySelector(".pu-net");if(puEl2)puEl2.textContent=pt2>0?puNet2.toFixed(3):"—";
        const totEl2=row2.querySelector(".line-total-ht");if(totEl2)totEl2.textContent=tot2>0?tot2.toFixed(3):"—";
      }}
    });
  }

  // Scope listeners to desktop table only (avoid picking up hidden mobile cards)
  const deskTbody=document.getElementById("desk-tbody");
  const scope=deskTbody||document;
  scope.querySelectorAll("[data-lid]").forEach(el=>{
    const lf=el.dataset.lf;
    if(lf==="designation")return;
    const handler=()=>{
      const lid=parseInt(el.dataset.lid);
      const line=S.form.lines.find(l=>l.id===lid);if(!line)return;
      line[lf]=el.value;
      if(["ref","dim","color","largeur","colorCustom"].includes(lf))updateDesignation(lid);
      if(["qty","prixTarif","remise"].includes(lf))updateLineTotals(lid);
    };
    el.addEventListener("input",handler);
    el.addEventListener("change",handler);
  });

  ["client","deadline","rep","paymentTerms"].forEach(id=>{
    const el=document.getElementById("f-"+id);
    if(el)el.addEventListener("input",()=>{S.form[id]=el.value;});
    if(el)el.addEventListener("change",()=>{S.form[id]=el.value;});
  });
}

// Live apur totals
function attachApurListeners(){
  document.querySelectorAll(".apur-qty,.apur-prix").forEach(el=>{
    el.addEventListener("input",()=>{
      const oid=el.dataset.oid,lid=parseInt(el.dataset.lid);
      const o=S.orders.find(x=>x.id===oid);if(!o)return;
      const line=(o.lines||[]).find(l=>l.id===lid);if(!line)return;
      // find partner
      const row=el.closest("tr");
      const allInputs=row?row.querySelectorAll("input"):[];
      let qty=0,prix=0;
      allInputs.forEach(i=>{if(i.classList.contains("apur-qty"))qty=parseFloat(i.value)||0;if(i.classList.contains("apur-prix"))prix=parseFloat(i.value)||0;});
      const val=qty*prix;
      const valCell=document.getElementById(`apur-val-${oid}-${lid}`);
      if(valCell)valCell.textContent=val>0?val.toFixed(3):"—";
      // recalc total
      let total=0;
      document.querySelectorAll(`.apur-qty[data-oid="${oid}"]`).forEach(qi=>{
        const lid2=parseInt(qi.dataset.lid);
        const pi=document.querySelector(`.apur-prix[data-oid="${oid}"][data-lid="${lid2}"]`);
        if(pi)total+=(parseFloat(qi.value)||0)*(parseFloat(pi.value)||0);
      });
      const totCell=document.getElementById(`apur-total-${oid}`);
      if(totCell)totCell.textContent=total>0?total.toFixed(3):"—";
    });
  });
}

// ─── RENDER DISPATCHER ───
function render(){
  const el=document.getElementById("content");
  try{
    if(S.tab==="dashboard")el.innerHTML=renderDashboard();
    else if(S.tab==="new_order")el.innerHTML=renderNewOrder();
    else if(S.tab==="orders")el.innerHTML=renderOrders();
    else if(S.tab==="launch")el.innerHTML=renderLaunch();
    else if(S.tab==="planning")el.innerHTML=renderPlanning();
    else if(S.tab==="apurement")el.innerHTML=renderApurement();
    else if(S.tab==="bons")el.innerHTML=renderBons();
    else if(S.tab==="pending")el.innerHTML=renderPending();
  }catch(err){
    console.error("Render error ["+S.tab+"]:",err);
    el.innerHTML=`<div class="card" style="border-color:var(--red)"><div style="color:var(--red);font-weight:700;margin-bottom:8px">⚠️ Erreur d'affichage</div><pre style="font-size:11px;color:var(--text2);white-space:pre-wrap">${String(err)}</pre></div>`;
  }
  // Attach status selects
  document.querySelectorAll(".st-sel[data-oid]").forEach(sel=>{
    sel.addEventListener("change",()=>{setOrderStatus(sel.dataset.oid,sel.value);render();});
  });
  attachFormListeners();
  attachApurListeners();
}

    <button class="btn btn-teal" onclick="acceptPendingOrder('${o.id}')"><i class="ti ti-check"></i>Confirmer et intégrer la commande</button>
    <button class="btn btn-sm btn-red" onclick="rejectPendingOrder('${o.id}')"><i class="ti ti-x"></i>Rejeter</button>

}

function applyRemiseOverride(id,val){
  if(!S.remiseOverrides)S.remiseOverrides={};
  S.remiseOverrides[id]=parseFloat(val)||0;
  render();
}

function genPdfFromPending(id){
  const o=S.pendingOrders.find(x=>x.id===id);if(!o)return;
  const toA3=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const lines=toA3(o.lines).filter(l=>l&&l.ref&&l.qty);
  const totalP=lines.filter(l=>!isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const totalF=lines.filter(l=>isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const remiseInfo=getRemisePoignee(totalP,o.client);
  const remiseOverride=(S.remiseOverrides||{})[id];
  const remiseApplied=remiseOverride!==undefined?remiseOverride:remiseInfo.remise;
  var totalHT=0;
  var lineRows=lines.map(function(l,i){
    var isFacade=l.ref.startsWith("F-");
    var nb=parseFloat(l.nbPcs)||0;
    var pt=parseFloat(l.prixTarif)||0;
    var rm=isFacade?0:remiseApplied;
    var puNet=pt*(1-rm/100);
    var tot=puNet*nb;
    totalHT+=tot;
    return'<tr><td>'+(i+1)+'</td><td>'+(l.designation||l.ref)+'</td>'+
      '<td style="text-align:right">'+nb.toLocaleString("fr-FR")+'</td>'+
      '<td style="text-align:right">'+(pt>0?pt.toFixed(3):"—")+'</td>'+
      '<td style="text-align:center">'+(rm>0?rm+"%":"—")+'</td>'+
      '<td style="text-align:right">'+(puNet>0?puNet.toFixed(3):"—")+'</td>'+
      '<td style="text-align:right;font-weight:bold">'+(tot>0?tot.toFixed(3):"—")+'</td></tr>';
  }).join("");
  var bonusRow="";
  if(remiseInfo.bonus>0){
    bonusRow='<tr style="background:#EAFAF1"><td colspan="5" style="font-style:italic;color:#0F6E56">Remise additionnelle client privilégié ('+remiseInfo.bonus+'%)</td>'+
      '<td colspan="2" style="text-align:right;font-weight:bold;color:#0F6E56">'+(-totalHT*remiseInfo.bonus/100).toFixed(3)+' TND</td></tr>';
  }
  var totalFinal=remiseInfo.bonus>0?totalHT*(1-remiseInfo.bonus/100):totalHT;
  const w=window.open("","_blank");
  if(!w){alert("Autorisez les popups.");return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Confirmation — '+o.client+'</title>');
  w.document.write('<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:12px;margin:0;color:#111}.page{padding:30px 35px;max-width:820px;margin:0 auto}.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:16px;margin-bottom:20px}.logo img{max-width:130px;max-height:65px}.company{text-align:right;font-size:11px;color:#444;line-height:1.7}.company strong{font-size:13px;color:#111;display:block;margin-bottom:4px}.doc-title{text-align:center;margin-bottom:20px}.doc-title h1{font-size:18px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin:0 0 4px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;background:#F5F5F5;padding:12px;border-radius:6px;font-size:12px}.meta-grid div span{color:#666}table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:11px}th{background:#17171A;color:#FFF;padding:7px 8px;text-align:left}td{padding:7px 8px;border-bottom:1px solid #E0E0E0}.totals-box{border-top:2px solid #111;padding-top:10px}.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}.total-row.grand{font-size:15px;font-weight:bold;border-top:1px solid #CCC;margin-top:6px;padding-top:8px}.qte-summary{display:flex;gap:20px;margin-top:14px}.qte-box{background:#F5F5F5;border-radius:6px;padding:10px 16px;flex:1;text-align:center}.qte-box .val{font-size:20px;font-weight:bold}.footer{margin-top:30px;border-top:1px solid #DDD;padding-top:12px;font-size:10px;color:#888;text-align:center}.badge-web{display:inline-block;background:#E6F1FB;color:#185FA5;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;margin-left:8px}@media print{.page{padding:15px}}</style></head><body><div class="page">');
  w.document.write('<div class="header"><div class="logo"><img src="'+LOGO_B64+'" alt="UND"></div><div class="company"><strong>Useful New and Design SA</strong>Route de l\'aéroport km 4, ZI Oued Chaabouni<br>Mobile : 98 797 979<br>Email : info@unddesign.co</div></div>');
  w.document.write('<div class="doc-title"><h1>Confirmation de commande <span class="badge-web">Commande web</span></h1><div style="font-size:12px;color:#555">Date : '+new Date().toLocaleDateString("fr-FR")+'</div></div>');
  w.document.write('<div class="meta-grid">'+
    '<div><span>Client : </span><strong>'+esc(o.client)+'</strong></div>'+
    '<div><span>Contact : </span><strong>'+esc(o.contact||"—")+'</strong></div>'+
    '<div><span>Mobile : </span><strong>'+esc(o.mobile||"—")+'</strong></div>'+
    '<div><span>Date demande : </span><strong>'+esc(o.date||"—")+'</strong></div>'+
  '</div>');
  w.document.write('<table><thead><tr><th>#</th><th>Désignation</th><th style="text-align:right">Nb pcs</th><th style="text-align:right">P.Tarif/pcs</th><th style="text-align:center">Remise</th><th style="text-align:right">P.U. Net</th><th style="text-align:right">Total HT</th></tr></thead><tbody>'+lineRows+bonusRow+'</tbody></table>');
  w.document.write('<div class="totals-box">');
  if(totalP>0)w.document.write('<div class="total-row"><span>Total poignées</span><span style="color:#0F6E56;font-weight:bold">'+totalP.toLocaleString("fr-FR")+' pcs</span></div>');
  if(totalF>0)w.document.write('<div class="total-row"><span>Total façades</span><span style="color:#534AB7;font-weight:bold">'+totalF.toLocaleString("fr-FR")+' pcs</span></div>');
  if(remiseInfo.bonus>0){
    w.document.write('<div class="total-row grand"><span>Total HT avant remise privilégiée</span><span>'+totalHT.toFixed(3)+' TND</span></div>');
    w.document.write('<div class="total-row" style="color:#0F6E56"><span>Remise client privilégié ('+remiseInfo.bonus+'%)</span><span>−'+(totalHT*remiseInfo.bonus/100).toFixed(3)+' TND</span></div>');
    w.document.write('<div class="total-row grand" style="background:#EAFAF1;padding:8px 10px;border-radius:6px;margin-top:6px"><span>TOTAL GÉNÉRAL HT NET</span><span style="color:#0F6E56">'+totalFinal.toFixed(3)+' TND</span></div>');
  } else {
    w.document.write('<div class="total-row grand"><span>TOTAL GÉNÉRAL HT</span><span>'+totalFinal.toFixed(3)+' TND</span></div>');
  }
  w.document.write('</div>');
  w.document.write('<div class="qte-summary">');
  if(totalP>0)w.document.write('<div class="qte-box"><div class="val">'+totalP.toLocaleString("fr-FR")+'</div><div>Poignées (pcs)</div></div>');
  if(totalF>0)w.document.write('<div class="qte-box"><div class="val">'+totalF.toLocaleString("fr-FR")+'</div><div>Façades (pcs)</div></div>');
  w.document.write('</div><div class="footer">Useful New and Design SA — Route de l\'aéroport km 4, ZI Oued Chaabouni — info@unddesign.co</div></div>');
  w.document.write('<script>window.onload=function(){window.print();}<\/script></body></html>');
  w.document.close();
}

// ─── FAÇADE CONFIGURATOR ───

function openFacadeConf(editId,ref){
  let cfg;
  if(editId!==null){
    const existing=S.form.facadeLines.find(f=>f.id===editId);
    cfg=existing?JSON.parse(JSON.stringify(existing.facadeConfig)):emptyFacadeConfig(ref||"F-500");
  } else {
    cfg=emptyFacadeConfig(ref||"F-500");
  }
  S.facadeConf={open:true,editId,cfg};
  render();
}

function updateFacadeHeight(val){
  if(!S.facadeConf||!S.facadeConf.cfg)return;
  const h=parseInt(val)||0;
  S.facadeConf.cfg.height=h||"";
  if(h>0){
    const cnt=calcHingeCount(h);
    S.facadeConf.cfg.hingeCount=cnt;
    S.facadeConf.cfg.hingePositions=calcHingePositions(cnt,h);
  }
  render();
}
function updateFacadeHingeCount(val){
  if(!S.facadeConf)return;
  const cnt=parseInt(val)||2;
  const h=parseInt(S.facadeConf.cfg.height)||0;
  S.facadeConf.cfg.hingeCount=cnt;
  S.facadeConf.cfg.hingePositions=h>0?calcHingePositions(cnt,h):Array(cnt).fill(0).map((_,i)=>135+i*200);
  render();
}

function saveFacadeConf(){
  if(!S.facadeConf||!S.facadeConf.open)return;
  const{editId,cfg}=S.facadeConf;
  const facadeLine={
    id:editId!==null?editId:"fac-"+Date.now(),
    ref:cfg.model,
    designation:buildFacadeDesignation(cfg),
    qty:cfg.qty||1,
    dim:cfg.height?String(cfg.height):"",
    largeur:cfg.width?String(cfg.width):"",
    color:cfg.color||"",
    unit:"pcs",
    prixTarif:"",
    facadeConfig:JSON.parse(JSON.stringify(cfg)),
  };
  if(editId!==null){
    S.form.facadeLines=S.form.facadeLines.map(f=>f.id===editId?facadeLine:f);
  } else {
    S.form.facadeLines=[...S.form.facadeLines,facadeLine];
  }
  S.facadeConf={open:false,editId:null,cfg:null};
  render();
}

      <span><strong>Charnières :</strong> ${m.hingeType||"—"}</span>
      <span><strong>Poignée :</strong> ${fixedHandle?"Incluse":hasHandle?"Optionnelle":"Non"}</span>
    </div>
  </div>

  <!-- Dimensions + Couleur -->
  <div class="card" style="margin-bottom:12px">
    <div class="card-title"><i class="ti ti-ruler"></i>Dimensions & Couleur</div>
    <div class="form-grid">
      <div class="form-group">

      </div>
      <div class="form-group">
        <label>Couleur / Finition</label>
        <select onchange="S.facadeConf.cfg.color=this.value;render()">

  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
    <button class="btn" onclick="S.facadeConf={open:false,editId:null,cfg:null};render()"><i class="ti ti-x"></i>Annuler</button>
    <button class="btn btn-primary" onclick="saveFacadeConf()"><i class="ti ti-check"></i>Valider la configuration</button>
  </div>`;
}

// ── SLACK NOTIFICATION ──────────────────────────────────────────────────────
let SLACK_WEBHOOK="";
function sendSlackNotif(order,source){
  if(!SLACK_WEBHOOK){console.warn("Slack webhook not configured");return;}
  const toA=x=>Array.isArray(x)?x:(x?Object.values(x):[]);
  const lines=toA(order.lines||[]).filter(l=>l&&l.ref&&l.qty);
  const totalP=lines.filter(l=>!isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const totalF=lines.filter(l=>isFacadeRef(l.ref)).reduce((s,l)=>s+nbPcsFromLine(l),0);
  const icon=source==="WEB"?"🌐":"🏭";
  const sourceLabel=source==="WEB"?"Commande web client":"Commande atelier";
  const articlesSummary=[];
  if(totalP>0)articlesSummary.push("*"+totalP.toLocaleString("fr-FR")+" pcs* poignées");
  if(totalF>0)articlesSummary.push("*"+totalF.toLocaleString("fr-FR")+" pcs* façades");
  const detailLines=lines.slice(0,5).map(l=>{
    const nb=nbPcsFromLine(l);
    return"• "+esc(l.designation||l.ref)+" — "+nb.toLocaleString("fr-FR")+" pcs";
  }).join("\n")+(lines.length>5?"\n• … et "+(lines.length-5)+" autre(s)":"");
  const msg={
    blocks:[
      {type:"header",text:{type:"plain_text",text:icon+" Nouvelle commande — "+order.id,emoji:true}},
      {type:"section",fields:[
        {type:"mrkdwn",text:"*Client :*\n"+(order.client||"—")},
        {type:"mrkdwn",text:"*Source :*\n"+sourceLabel},
        ...(order.contact?[{type:"mrkdwn",text:"*Contact :*\n"+order.contact}]:[]),
        ...(order.mobile?[{type:"mrkdwn",text:"*Mobile :*\n"+order.mobile}]:[]),
        ...(order.deadline?[{type:"mrkdwn",text:"*Délai :*\n"+order.deadline}]:[]),
        ...(order.rep?[{type:"mrkdwn",text:"*Représentant :*\n"+order.rep}]:[]),
      ]},
      ...(articlesSummary.length?[{type:"section",text:{type:"mrkdwn",text:"📦 "+articlesSummary.join(" — ")}}]:[]),
      ...(detailLines?[{type:"section",text:{type:"mrkdwn",text:detailLines}}]:[]),
      {type:"divider"},
      {type:"context",elements:[{type:"mrkdwn",text:"UND Atelier — "+new Date().toLocaleString("fr-FR")}]}
    ]
  };
  // no-cors mode: browser sends the request, Slack receives it (response opaque but message delivered)
  fetch(SLACK_WEBHOOK,{method:"POST",mode:"no-cors",body:JSON.stringify(msg)})
    .catch(e=>console.warn("Slack notification failed:",e));
}

// Set webhook URL (called after user provides it)
function promptSlackWebhook(){
  const current=SLACK_WEBHOOK?"Webhook actuel configuré.":"⚠️ Aucun webhook configuré.";
  const url=prompt(current+"\n\nCollez la nouvelle URL webhook Slack :\n(https://hooks.slack.com/services/...)","");
  if(url&&url.startsWith("https://hooks.slack.com/"))setSlackWebhook(url);
  else if(url)alert("URL invalide. Elle doit commencer par https://hooks.slack.com/");
}
function setSlackWebhook(url){
  SLACK_WEBHOOK=url.trim();
  if(db)db.ref("config/slackWebhook").set(SLACK_WEBHOOK);
  alert("✅ Webhook Slack enregistré.");
}
