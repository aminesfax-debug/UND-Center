<title>UND — Déclaration de production</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-bg:#E1F5EE;
  --red:#A32D2D;--red-bg:#FDEAEA;
  --border:#DDDBD5;--border2:#C8C6BF;
  --text:#1A1A18;--text2:#6A6A65;--text3:#A8A8A3;
  --surface:#FFF;--surface2:#F4F3EF;
  --r:8px;--rl:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--surface2);color:var(--text);font-size:15px;min-height:100vh}
.hdr{background:#17171A;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.hdr img{height:34px}
.hdr-txt h1{font-size:15px;font-weight:700;color:#FFF}
.hdr-txt p{font-size:11px;color:#888;margin-top:1px}
.dot{width:10px;height:10px;border-radius:50%;background:#888;margin-left:auto;flex-shrink:0}
.dot.green{background:#1D9E75}
.wrap{max-width:700px;margin:0 auto;padding:16px 14px 80px}
.card{background:#FFF;border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;color:var(--text)}
.card-title i{font-size:16px;color:var(--teal)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
label.fl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r);width:100%;background:#FFF;color:var(--text);-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:#17171A;box-shadow:0 0 0 3px rgba(23,23,26,.08)}
input[type=number]{font-size:17px;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:2px solid var(--border);text-align:left;background:var(--surface2)}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl input,
.tbl select{font-size:14px;padding:8px 10px;border-radius:var(--r)}
.tbl input[type=number]{font-size:15px;font-weight:700;width:80px;text-align:right}
.qty-ok{color:var(--teal)}
.qty-nc{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:var(--r);border:1.5px solid var(--border);background:#FFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s}
.btn-add{background:var(--surface2);border:1.5px dashed var(--border2);color:var(--text2);width:100%;margin-top:8px;padding:12px}
.btn-submit{background:#17171A;color:#FFF;border:none;width:100%;padding:16px;font-size:16px;border-radius:var(--rl);letter-spacing:.2px}
.btn-submit:disabled{background:#888;cursor:not-allowed}
.btn-del{padding:6px 10px;border-radius:var(--r);border:1px solid #F09595;background:#FCEBEB;color:var(--red);cursor:pointer;font-size:13px}
.success-screen{display:none;text-align:center;padding:3rem 1rem}
.success-ico{font-size:64px;margin-bottom:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-of{background:var(--teal-bg);color:var(--teal)}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .hide-mob{display:none}
  input,select{font-size:16px}
}
</style>
</head>

  <div class="hdr-txt"><h1>Déclaration de production</h1><p>Useful New and Design</p></div>
  <div class="dot" id="conn-dot"></div>
</div>

<div class="wrap" id="form-area">

  <!-- En-tête déclaration -->
  <div class="card">
    <div class="card-title"><i class="ti ti-clipboard-data"></i>Informations générales</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="fl">Date *</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label class="fl">Poste de travail *</label>
        <select id="f-ws"><option value="">— Choisir —</option></select>
      </div>
      <div class="form-group">
        <label class="fl">Ordre de fabrication (OF) *</label>
        <select id="f-of" onchange="onOfChange()"><option value="">— Choisir un OF —</option></select>
      </div>
      <div class="form-group">
        <label class="fl">Opération *</label>
        <select id="f-op"><option value="">— Choisir d'abord un OF —</option></select>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label class="fl">Opérateur *</label>
        <input type="text" id="f-operator" placeholder="Votre nom" autocomplete="name">
      </div>
    </div>
  </div>

  <!-- Lignes de production -->
  <div class="card">
    <div class="card-title"><i class="ti ti-list-check"></i>Quantités produites</div>
    <div id="lines-container">
      <!-- Lines injected here -->
    </div>
    <button class="btn btn-add" onclick="addLine()">
      <i class="ti ti-plus"></i> Ajouter une ligne
    </button>
  </div>

  <!-- Notes -->
  <div class="card">
    <div class="form-group">
      <label class="fl">Notes / observations</label>
      <textarea id="f-notes" rows="3" placeholder="Problèmes rencontrés, observations…" style="resize:vertical"></textarea>
    </div>
  </div>

  <div id="err-msg" style="display:none;color:var(--red);font-size:13px;font-weight:600;margin-bottom:12px;padding:10px 14px;background:var(--red-bg);border-radius:var(--r)"></div>

  <button class="btn btn-submit" id="btn-submit" onclick="submitDecl()">
    <i class="ti ti-check"></i> Valider la déclaration
  </button>
</div>

<!-- Success screen -->
<div class="success-screen" id="success-screen">
  <div class="success-ico">✅</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:10px">Déclaration envoyée !</h2>
  <p style="color:var(--text2);margin-bottom:6px" id="success-summary"></p>
  <p style="color:var(--text3);font-size:13px;margin-bottom:24px">Sauvegardée dans le système.</p>
  <button class="btn" onclick="resetForm()" style="margin:0 auto"><i class="ti ti-plus"></i>Nouvelle déclaration</button>
</div>

<script>
const FB_CONFIG = {
  apiKey:            "AIzaSyC2Zf5CSAVEx4axHRUan8xcNe66MD7yVG4",
  authDomain:        "und-center.firebaseapp.com",
  databaseURL:       "https://und-center-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "und-center",
  storageBucket:     "und-center.firebasestorage.app",
  messagingSenderId: "248182618048",
  appId:             "1:248182618048:web:54c2cf9dc55a424f197a25"
};
// ════════════════════════════════════════════════════════

firebase.initializeApp(FB_CONFIG);
const db=firebase.database();

// ── CONSTANTS ──
const CAUSES_NC=["Rayure","Déformation","Mauvaise coupe","Bavure","Défaut peinture","Trou mal percé","Autre"];
const DIMS=["10","15","20","25","30","35","40","45","50","60","80","90","100","120","150"];
let WS=[];
let OFS=[];
let SLACK_PROD_WEBHOOK="";
let lineCount=0;

function todayStr(){return new Date().toISOString().split("T")[0];}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ── INIT ──
document.getElementById("f-date").value=todayStr();

db.ref(".info/connected").on("value",s=>{
  document.getElementById("conn-dot").className="dot"+(s.val()?" green":"");
});

// Load workstations
db.ref("config/ws").once("value").then(s=>{
  const data=s.val();
  const fallback=[
    {id:"press60",name:"Presse 60T"},{id:"ebav1",name:"Ébavurage 1"},
    {id:"ebav2",name:"Ébavurage 2"},{id:"coupe_auto",name:"Coupe auto"},
    {id:"perc_tar",name:"Perçage/Taraudage"},{id:"peinture",name:"Ligne peinture"},
  ];
  WS=Array.isArray(data)?data:fallback;
  const sel=document.getElementById("f-ws");
  sel.innerHTML='<option value="">— Choisir —</option>'+WS.map(w=>`<option value="${w.id}">${w.name}</option>`).join("");
}).catch(()=>{});

// Load active OFs
db.ref("ofs").once("value").then(s=>{
  const data=s.val();
  if(!data)return;
  OFS=Object.values(data).filter(o=>o&&(o.status==="LANCÉ"||o.status==="EN_COURS"||!o.status));
  const sel=document.getElementById("f-of");
  sel.innerHTML='<option value="">— Choisir un OF —</option>'+
    OFS.map(o=>`<option value="${o.id}">${o.id}${o.ref?" — "+o.ref:""}</option>`).join("");
}).catch(()=>{});

// Load prod webhook
db.ref("config/slackProdWebhook").once("value").then(s=>{if(s.val())SLACK_PROD_WEBHOOK=s.val();}).catch(()=>{});

// ── OF CHANGE ──
function onOfChange(){
  const ofId=document.getElementById("f-of").value;
  const of=OFS.find(o=>o.id===ofId);
  const sel=document.getElementById("f-op");
  if(!of){sel.innerHTML='<option value="">— Choisir d\'abord un OF —</option>';return;}
  
  // Get operations from OF groups
  const postes=new Set();
  (of.groups||[]).forEach(g=>{(g.postes||[]).forEach(p=>postes.add(p));});
  
  sel.innerHTML='<option value="">— Choisir —</option>'+
    [...postes].map(p=>`<option value="${p}">${p}</option>`).join("");
  
  // Auto-fill lines from OF refs
  const refs=new Set();
  (of.groups||[]).forEach(g=>{
    if(g.ref)refs.add(g.ref);
    (g.lines||[]).forEach(l=>{if(l.ref)refs.add(l.ref);});
  });
  if(of.ref)refs.add(of.ref);
  
  // Reset lines
  lineCount=0;
  document.getElementById("lines-container").innerHTML="";
  if(refs.size>0){
    [...refs].forEach(ref=>addLine(ref));
  }else{
    addLine();
  }
}

// ── LINES ──
function addLine(prefillRef){
  lineCount++;
  const lid=lineCount;
  const refsOpts=['<option value="">— Réf —</option>',
    "P-204","P-210","P-215","P-229","P-231","P-234","P-235","P-236","P-239","P-240","P-241","P-242",
    "F-500","F-501","F-502","F-503","F-505","SKIN-MINI","SKIN-MAXI"
  ].map((r,i)=>i===0?r:`<option value="${r}"${r===prefillRef?' selected':''}>${r}</option>`).join("");
  
  const dimsOpts='<option value="">— Dim —</option>'+DIMS.map(d=>`<option value="${d}">${d} cm</option>`).join("");
  const causeOpts='<option value="">—</option>'+CAUSES_NC.map(c=>`<option value="${c}">${c}</option>`).join("");
  
  const div=document.createElement("div");
  div.id="line-"+lid;
  div.style.cssText="border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--surface2)";
  div.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;font-weight:700;color:var(--text2)">Ligne ${lid}</span>
      <button class="btn-del" onclick="removeLine(${lid})"><i class="ti ti-trash"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div class="form-group">
        <label class="fl">Référence</label>
        <select id="l-ref-${lid}">${refsOpts}</select>
      </div>
      <div class="form-group">
        <label class="fl">Dimension</label>
        <select id="l-dim-${lid}">${dimsOpts}</select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="form-group">
        <label class="fl" style="color:var(--teal)">✓ Qté OK (pcs)</label>
        <input type="number" id="l-ok-${lid}" placeholder="0" min="0" style="color:var(--teal);border-color:var(--teal)">
      </div>
      <div class="form-group">
        <label class="fl" style="color:var(--red)">✗ Qté NC (pcs)</label>
        <input type="number" id="l-nc-${lid}" placeholder="0" min="0" style="color:var(--red);border-color:#F09595" oninput="toggleCause(${lid},this.value)">
      </div>
      <div class="form-group" id="cause-group-${lid}" style="display:none">
        <label class="fl">Cause NC</label>
        <select id="l-cause-${lid}">${causeOpts}</select>
      </div>
    </div>`;
  document.getElementById("lines-container").appendChild(div);
}

function removeLine(lid){
  const el=document.getElementById("line-"+lid);
  if(el)el.remove();
}

function toggleCause(lid,val){
  const grp=document.getElementById("cause-group-"+lid);
  if(grp)grp.style.display=parseFloat(val)>0?"flex":"none";
}

// ── SUBMIT ──
function submitDecl(){
  const date=document.getElementById("f-date").value;
  const wsId=document.getElementById("f-ws").value;
  const ofId=document.getElementById("f-of").value;
  const operation=document.getElementById("f-op").value;
  const operator=document.getElementById("f-operator").value.trim();
  const notes=document.getElementById("f-notes").value.trim();
  const errEl=document.getElementById("err-msg");
  errEl.style.display="none";
  
  if(!date||!wsId||!ofId||!operation||!operator){
    errEl.textContent="Veuillez remplir tous les champs obligatoires (poste, OF, opération, opérateur).";
    errEl.style.display="block";
    return;
  }
  
  // Collect lines
  const lines=[];
  for(let i=1;i<=lineCount;i++){
    const refEl=document.getElementById("l-ref-"+i);
    if(!refEl)continue;
    const ref=refEl.value;
    const dim=document.getElementById("l-dim-"+i)?.value||"";
    const qtyOK=parseFloat(document.getElementById("l-ok-"+i)?.value)||0;
    const qtyNC=parseFloat(document.getElementById("l-nc-"+i)?.value)||0;
    const causeNC=document.getElementById("l-cause-"+i)?.value||"";
    if(ref&&(qtyOK>0||qtyNC>0))lines.push({id:i,ref,dim,qtyOK,qtyNC,causeNC});
  }
  
  if(!lines.length){
    errEl.textContent="Veuillez saisir au moins une ligne avec une quantité.";
    errEl.style.display="block";
    return;
  }
  
  const btn=document.getElementById("btn-submit");
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Envoi…';
  
  const id="DEC-"+Date.now();
  const decl={id,date,wsId,ofId,operation,operator,lines,notes,
    createdAt:new Date().toISOString(),status:"VALIDÉE",source:"OPERATEUR"};
  
  db.ref("declarations/"+id).set(decl).then(()=>{
    sendProdNotif(decl);
    showSuccess(decl);
  }).catch(err=>{
    errEl.textContent="Erreur : "+err.message;
    errEl.style.display="block";
    btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i> Valider la déclaration';
  });
}

function showSuccess(decl){
  const ws=WS.find(w=>w.id===decl.wsId);
  const totalOK=decl.lines.reduce((s,l)=>s+(l.qtyOK||0),0);
  const totalNC=decl.lines.reduce((s,l)=>s+(l.qtyNC||0),0);
  document.getElementById("form-area").style.display="none";
  const sc=document.getElementById("success-screen");
  sc.style.display="block";
  document.getElementById("success-summary").innerHTML=
    `<strong>${decl.ofId}</strong> — ${decl.operation}<br>`+
    `${ws?ws.name:decl.wsId} — ${decl.operator}<br>`+
    `<span style="color:var(--teal);font-weight:700">${totalOK} pcs OK</span>`+
    (totalNC>0?` — <span style="color:var(--red);font-weight:700">${totalNC} NC</span>`:"");
}

function resetForm(){
  document.getElementById("form-area").style.display="block";
  document.getElementById("success-screen").style.display="none";
  document.getElementById("f-date").value=todayStr();
  document.getElementById("f-ws").value="";
  document.getElementById("f-of").value="";
  document.getElementById("f-op").innerHTML='<option value="">— Choisir d\'abord un OF —</option>';
  document.getElementById("f-operator").value="";
  document.getElementById("f-notes").value="";
  document.getElementById("lines-container").innerHTML="";
  document.getElementById("err-msg").style.display="none";
  const btn=document.getElementById("btn-submit");
  btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i> Valider la déclaration';
  lineCount=0;
  addLine();
}

function sendProdNotif(decl){
  if(!SLACK_PROD_WEBHOOK)return;
  const ws=WS.find(w=>w.id===decl.wsId);
  const totalOK=decl.lines.reduce((s,l)=>s+(l.qtyOK||0),0);
  const totalNC=decl.lines.reduce((s,l)=>s+(l.qtyNC||0),0);
  const lines=decl.lines.map(l=>"• "+l.ref+(l.dim?" "+l.dim+"cm":"")+" : "+l.qtyOK+" OK"+(l.qtyNC>0?" / "+l.qtyNC+" NC ("+l.causeNC+")":"")).join("\n");
  const msg={blocks:[
    {type:"header",text:{type:"plain_text",text:"🏭 Déclaration production — "+decl.ofId,emoji:true}},
    {type:"section",fields:[
      {type:"mrkdwn",text:"*Opérateur :*\n"+decl.operator},
      {type:"mrkdwn",text:"*Poste :*\n"+(ws?ws.name:decl.wsId)},
      {type:"mrkdwn",text:"*Opération :*\n"+decl.operation},
      {type:"mrkdwn",text:"*Date :*\n"+decl.date},
    ]},
    {type:"section",text:{type:"mrkdwn",text:lines}},
    {type:"section",text:{type:"mrkdwn",text:"*Total : "+totalOK+" pcs OK*"+(totalNC>0?" — "+totalNC+" NC":"")}}
  ]};
  fetch(SLACK_PROD_WEBHOOK,{method:"POST",mode:"no-cors",body:JSON.stringify(msg)}).catch(()=>{});
}

// Init with one empty line
addLine();
</script>
</body>
